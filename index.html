<script>
/* ============================================================
   world.js — 숨은 변수 · 인과 · 기억 · 정보 · 사건

   engine.js는 돈과 톤을 계산한다. 이 파일은 그 위에서 "회사가 어떤 상태인가"를
   계산한다. 설비가 얼마나 닳았는지, 고객이 우리를 어떻게 보는지, 현장이 얼마나
   지쳤는지. 플레이어는 이 숫자를 직접 보지 못하고 부장들의 말과 징후로만 안다.

   이 게임의 약속 하나 — 사건은 아무 데서나 떨어지지 않는다.
   고장은 정비를 미룬 만큼, 클레임은 무리한 만큼, 가격 재요구는 양보한 만큼 온다.
   그리고 터질 때는 무엇 때문에 터졌는지 짚어준다.
   ============================================================ */

const CUST = { JP: 'J사', EU: 'E사', CN: 'C사', PART: 'P사', HOME: 'H사' };
const cname = k => `${CUST[k]}(${CFG.CUSTOMERS[k].name})`;
const wClamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const wPick = a => a[Math.floor(Math.random() * a.length)];
const wChance = p => Math.random() < p;
const AGO = ['이번 달', '지난달', '두 달 전', '석 달 전', '넉 달 전', '다섯 달 전', '여섯 달 전'];
const ago = n => AGO[n] || `${n}개월 전`;

/* ---------- 겉으로 보이는 말 ---------- */
function relLabel(v) {
  return v >= 80 ? '매우 우호적' : v >= 65 ? '우호적' : v >= 50 ? '보통' : v >= 35 ? '불안' : '이탈 위험';
}
function relCls(v) { return v >= 65 ? 'up' : v >= 50 ? 'neu' : 'dn'; }
function equipLabel(v) { return v >= 75 ? '양호' : v >= 60 ? '보통' : v >= 45 ? '주의' : '위험'; }
function fatigueLabel(v) { return v < 20 ? '여유' : v < 40 ? '바쁨' : v < 60 ? '과부하' : '한계'; }
const qualityPct = q => 94 + q * 0.05;          // 품질 지수 74 → 양품률 97.7%

/* 연차별 흐름. 순서는 같지만 무슨 일이 벌어지는지는 플레이어가 정한다. */
const YEAR_THEME = [
  { name: '정상화', text: '전임자가 미뤄둔 정비와 묵은 재고부터 정리해야 합니다. 본사는 올해는 지켜보겠다고 합니다.' },
  { name: '성장', text: '본사가 소재 판매를 늘리라고 합니다. 물량 제안과 신규 고객이 들어오는 해입니다.' },
  { name: '성장의 부작용', text: '작년에 늘린 것들이 청구서를 보내는 해입니다. 설비·품질·재고·현금을 봐야 합니다.' },
  { name: '위기와 선택', text: '지금까지의 선택이 결과로 돌아옵니다. 마지막 해입니다.' },
];
const HQ_GROWTH = [1.00, 1.15, 1.10, 1.08];   // 본사가 매년 요구하는 소재 판매 증가

/* ============================================================
   시작 상태
   ============================================================ */
function initWorld(s, diff) {
  const hard = diff && diff.key === 'hard';
  const W = {
    equip: hard ? 55 : 62,        // 전임자가 정비를 한 번 미뤘다
    quality: hard ? 69 : 74,
    fatigue: 0,
    rel:     { JP: 68, EU: hard ? 50 : 62, CN: 55, PART: 58, HOME: 60 },
    cut:     { JP: 0, EU: 0, CN: 0, PART: 0, HOME: 0 },   // 고객별로 깎아준 단가 ($/t). 계약이 살아 있는 한 남는다
    concede: { JP: 0, EU: 0, CN: 0, PART: 0, HOME: 0 },   // 양보한 횟수. 한 번 깎아주면 또 온다
    relHigh: { JP: 0, EU: 0, CN: 0, PART: 0, HOME: 0 },
    threat: {},                   // 이번 달 경쟁사가 실제로 들어간 고객 (숨김)
    comp: 35,                     // 경쟁사 공격성 (숨김)
    deferMaint: 1, maintAge: 7,
    priceDir: 0, priceRumor: null, // 본사 가격 방향 (숨김) 과 그에 대한 소문
    policy: 'normal',
    hq: { target: 0, ytd: 0, commit: null, log: [] },
    mem: [], impacts: [], lastImpacts: [], fired: [], lastFired: [],
    snaps: [], utilHist: [], coverHist: [], shareHist: {},
    breakdown: null, claim: null, capHit: 1, qBoost: 0,
    stats: { breakdowns: 0, claims: 0, shortages: 0, concessions: 0, deferrals: 0, maint: 0,
             overloadMonths: 0, utilSum: 0, months: 0, churn: 0, hqHit: 0, hqMiss: 0,
             cashTight: 0, qualSum: 0, projects: 0, dropped: 0 },
    style: { grow: 0, cash: 0, cust: 0, craft: 0, hq: 0 },
  };
  for (const k in CUST) W.shareHist[k] = [];
  return W;
}

/* 전임 사장이 남긴 것 — 1년차 "정상화"가 무엇을 정상화하는지 */
function applyLegacy(s) {
  const t = 2400, cost = CFG.P_M_BASE * 1.06;
  s.invRaw.push({ qty: t, unitCost: cost, arrivalTurn: -5, dt: 'SPOT', gr: 'COMMON' });
  s.cash -= t * cost;
}

/* ============================================================
   기억 — 게임은 플레이어가 한 일을 잊지 않는다
   ============================================================ */
function remember(W, s, tag, label, extra = {}) {
  W.mem.push({ turn: s.turn, tag, label, ...extra });
}
function styleAdd(W, key, n = 1) { if (key) W.style[key] = (W.style[key] || 0) + n; }

/* 지금 터진 일의 원인이 될 만한 과거 결정을 찾는다 */
function cause(W, s, tags, cust) {
  const hit = [...W.mem].reverse().find(m =>
    s.turn - m.turn <= 8 && tags.some(t => m.tag === t) && (!cust || !m.cust || m.cust === cust));
  return hit ? `${ago(s.turn - hit.turn)} ${hit.label}` : null;
}

/* 이번 달 여파 — 결산 화면과 다음 달 브리핑에 뜬다 */
function fire(W, s, kind, text, why) {
  W.fired.push({ turn: s.turn, kind, text, why });
}

/* 결정이 무엇을 움직였는지 — 결산 뒤 "지난달 결정의 영향"으로 풀어서 보여준다 */
function lever(G, label, o) {
  G.W.impacts.push({ label, ...o });
}

/* 한 고객의 물량을 키운다. 회사 전체 물량은 그 고객 비중만큼만 늘어난다. */
function growCust(s, k, pct) {
  const sh = s.custShare[k] || 0;
  // 라인이 꽉 찼으면 더 받아도 못 만든다. 늘어나는 건 계약서 숫자뿐이다.
  if (pct > 0 && G && G.W) {
    const u = G.W.utilHist.slice(-1)[0] ?? 0.8;
    pct *= Math.max(0.2, Math.min(1, (0.98 - u) / 0.25));
  }
  s.myShare *= 1 + sh * pct;
  s.custShare[k] = sh * (1 + pct);
  normalizeShare(s);
  return 1 + sh * pct;
}
function normalizeShare(s) {
  let t = 0;
  for (const k in CUST) t += s.custShare[k] || 0;
  if (t > 0) for (const k in CUST) s.custShare[k] = (s.custShare[k] || 0) / t;
}
function topCust(s) {
  return Object.keys(CUST).sort((a, b) => (s.custShare[b] || 0) - (s.custShare[a] || 0))[0];
}
function standingCut(s, W) {
  let c = 0;
  // 한 고객에 톤당 $30 넘게 깎아주는 계약은 본사가 승인하지 않는다
  for (const k in CUST) { W.cut[k] = Math.min(30, W.cut[k] || 0); c += (s.custShare[k] || 0) * W.cut[k]; }
  return c;
}
function coverOf(s) {
  const L = look(s);
  return L.need > 0 ? (inventoryTons(s) + openPoTons(s)) / L.need : 9;
}
/* 통장과 은행 한도로 몇 달을 버티나 */
function runway(s) {
  const L = look(s);
  const burn = L.need * s.market.pm * 0.85 + CFG.FC_BASE;
  return (s.cash + Math.max(0, s.debt.limit - s.debt.principal)) / Math.max(1, burn);
}

/* ============================================================
   매달 결산 직전 — 숨은 상태가 엔진의 캐파와 수율을 움직인다
   ============================================================ */
function worldPre(s, W) {
  let cap = W.capHit * (1 + (W.capBonus || 0));        // 고장·정비·인력 공백, 충원한 인력
  if (W.equip < 60) cap *= 1 - (60 - W.equip) * 0.004;  // 잔고장
  s.mods = { capMult: cap, yieldAdj: (W.quality - 75) * 0.0005 };
}

/* ============================================================
   매달 결산 직후 — 인과가 한 칸씩 굴러간다
   ============================================================ */
function worldPost(s, W, R, G) {
  const u = R.util || 0;
  W.utilHist.push(u);
  W.coverHist.push(coverOf(s));
  for (const k in CUST) W.shareHist[k].push(s.custShare[k] || 0);
  W.capHit = 1;

  // 1. 설비 — 돌릴수록 닳고, 무리할수록 빨리 닳는다
  W.equip = wClamp(W.equip - (1.1 + Math.max(0, u - 0.72) * 13 + W.fatigue * 0.02));
  W.maintAge++;

  // 2. 과부하 — 90%를 넘기면 쌓이고, 숨을 돌리면 빠진다
  if (u > 0.9) { W.fatigue = wClamp(W.fatigue + 5 + (u - 0.9) * 150); W.stats.overloadMonths++; }
  else W.fatigue = wClamp(W.fatigue - (u < 0.75 ? 12 : 6));
  if (W.fatigue > 40) s.morale = wClamp(s.morale - (W.fatigue - 40) * 0.07);
  else if (W.fatigue < 25) s.morale = wClamp(s.morale + (58 - s.morale) * 0.05);   // 숨을 돌리면 조금씩 돌아온다

  // 3. 품질 — 설비·사기·피로가 정하는 수준으로 천천히 끌려간다
  const qT = 48 + W.equip * 0.3 + s.morale * 0.15 - W.fatigue * 0.18 + W.qBoost;
  W.quality = wClamp(W.quality + (qT - W.quality) * 0.22);
  W.qBoost = Math.max(0, W.qBoost - 2);

  // 4. 납기 — 못 맞추면 큰 고객부터 관계를 잃는다
  const order = Object.keys(CUST).sort((a, b) => (s.custShare[b] || 0) - (s.custShare[a] || 0));
  const sr = R.shortRatio ?? 1;
  if (s.turn > 5 && sr < 0.9) {
    const hit = 3 + (1 - sr) * 20;
    W.rel[order[0]] = wClamp(W.rel[order[0]] - hit);
    W.rel[order[1]] = wClamp(W.rel[order[1]] - hit / 2);
    W.stats.shortages++;
    // 같은 결품이 매달 이어지면 청구서는 한 번만 — 관계 손상은 매달 쌓인다
    if (s.turn - (W.shortFired ?? -99) > 2) { W.shortFired = s.turn;
    fire(W, s, 'short', `납기를 못 맞췄습니다. ${cname(order[0])}와 ${cname(order[1])}가 불만을 표시했습니다.`,
      cause(W, s, ['underbuy', 'volume', 'project', 'breakdown', 'policy-tight'])); }
  }

  // 5. 관계 — 품질이 스며들고, 평소엔 보통으로 돌아가려 하고, 약한 고리는 경쟁사가 판다
  for (const k in CUST) {
    let r = W.rel[k];
    r += (W.quality - 70) * 0.04;
    r += (62 - r) * 0.05;
    if (r < 50) r -= Math.max(0, W.comp - 35) * 0.05;
    W.rel[k] = wClamp(r);
    W.relHigh[k] = W.rel[k] >= 78 ? W.relHigh[k] + 1 : 0;
  }

  // 6. 이탈과 우호
  for (const k in CUST) {
    const sh = s.custShare[k] || 0;
    W.churnAt = W.churnAt || {};
    if (W.rel[k] < 32 && sh > 0.04 && s.turn - (W.churnAt[k] ?? -99) >= 4) {
      W.churnAt[k] = s.turn;
      s.custShare[k] = sh * 0.92; s.myShare *= 0.99; W.stats.churn++;
      fire(W, s, 'churn', `${cname(k)} 물량 일부가 경쟁사로 넘어갔습니다.`,
        cause(W, s, ['hold', 'deny', 'claim', 'short'], k));
    } else if (W.rel[k] > 80) s.myShare *= 1.003;
  }
  normalizeShare(s);

  // 7. 경쟁사 — 불황에는 굶주려서 덤빈다
  const ct = { BUST: 62, NORMAL: 42, BOOM: 26 }[s.market.phase] || 40;
  W.comp = wClamp(W.comp + (ct - W.comp) * 0.2 + (Math.random() - 0.5) * 6);
  W.threat = {};
  for (const k in CUST) {
    const sh = s.custShare[k] || 0;
    const p = Math.max(0, W.comp - 25) / 100 * (0.6 + sh * 2) * (1 + W.concede[k] * 0.3);
    if (wChance(p)) W.threat[k] = true;
  }

  // 8. 본사 가격 방향 — 분기마다 정해지고 실제로 시세를 민다. 소문은 70%만 맞다
  if ((s.turn) % 3 === 0) {
    W.priceDir = wChance(0.32) ? 1 : wChance(0.45) ? -1 : 0;
    W.priceRumor = wChance(0.7) ? W.priceDir : wPick([1, -1, 0].filter(x => x !== W.priceDir));
  }
  s.market.pm = Math.max(400, Math.min(1400, s.market.pm * (1 + W.priceDir * 0.011)));

  // 9. 본사 연간 목표
  W.hq.ytd += R.materialTons || 0;
  if (s.turn % 12 === 0 && W.hq.target > 0) hqYearEnd(s, W);

  // 10. 한 번 깎아준 기억은 천천히 옅어진다
  if (s.turn % 8 === 0) for (const k in CUST) W.concede[k] = Math.max(0, W.concede[k] - 1);
  // 연간 단가 재협상 — 깎아준 단가는 해가 바뀌면 절반쯤 되돌릴 수 있다. 전부는 못 돌린다.
  if (s.turn % 12 === 0) {
    const back = Object.keys(CUST).filter(k => W.cut[k] > 0);
    if (back.length) {
      for (const k of back) { W.cut[k] = Math.round(W.cut[k] * 0.5); W.rel[k] = wClamp(W.rel[k] - 3); }
      fire(W, s, 'renego', `연간 단가 재협상 — ${back.map(k => CUST[k]).join('·')}에 깎아준 단가의 절반을 되돌렸습니다. 고객들은 불만입니다.`,
        '그동안 해준 가격 양보');
    }
  }

  // 11. 통계
  W.stats.months++; W.stats.utilSum += u; W.stats.qualSum += W.quality;
  if (runway(s) < 1.5) W.stats.cashTight++;

  // 12. 다음에 터질 일 — 확률은 지금까지의 선택이 만든다
  if ((G.mpt || 1) === 1 || s.turn % 3 === 0) rollIncidents(s, W, (G.mpt || 1) > 1 ? 1.8 : 1);
}

function rollIncidents(s, W, k = 1) {
  if (s.turn < 4) return;
  const hot = W.utilHist.slice(-3).filter(u => u > 0.9).length;
  const pB = (Math.max(0, 58 - W.equip) / 100 * (1 + W.fatigue / 70)
            + (W.deferMaint >= 2 ? 0.04 : 0) + hot * 0.02) * k;
  if (!W.breakdown && wChance(pB)) W.breakdown = { turn: s.turn + 1, sev: W.equip < 40 ? 2 : 1 };

  const outs = W.mem.some(m => m.tag === 'outsource' && s.turn - m.turn <= 3);
  const pC = (Math.max(0, 72 - W.quality) / 100 * 1.4 + (outs ? 0.08 : 0)) * k;
  if (!W.claim && wChance(pC)) {
    // 최근에 물량을 몰아준 고객 라인에서 제일 먼저 문제가 드러난다
    const pushed = [...W.mem].reverse().find(m =>
      ['volume', 'project'].includes(m.tag) && m.cust && s.turn - m.turn <= 6);
    W.claim = { cust: pushed ? pushed.cust : topCust(s), turn: s.turn + 1 };
  }
}

function hqYearEnd(s, W) {
  const r = W.hq.ytd / W.hq.target;
  const yr = Math.floor((s.turn - 1) / 12) + 1;
  const promised = W.hq.commit === 'full' ? '약속한 목표' : W.hq.commit === 'low' ? '깎아서 받은 목표' : '목표';
  let text;
  if (r >= 1) { s.trust = wClamp(s.trust + 8); W.stats.hqHit++;
    text = `${yr}년차 본사 소재 판매 ${Math.round(r * 100)}% — ${promised}를 채웠습니다. 본사 평가가 좋습니다.`; }
  else if (r >= 0.9) { s.trust = wClamp(s.trust + 2);
    text = `${yr}년차 본사 소재 판매 ${Math.round(r * 100)}% — ${promised}에 조금 못 미쳤습니다.`; }
  else if (r >= 0.8) { s.trust = wClamp(s.trust - 5); W.stats.hqMiss++;
    text = `${yr}년차 본사 소재 판매 ${Math.round(r * 100)}% — ${promised}에 못 미쳤습니다. 본사가 아쉬워합니다.`; }
  else { s.trust = wClamp(s.trust - 10); s.myShare *= 0.97; W.stats.hqMiss++;
    text = `${yr}년차 본사 소재 판매 ${Math.round(r * 100)}% — ${promised}에 크게 못 미쳤습니다. 본사가 내년 내시를 줄이겠답니다.`; }
  W.hq.log.push({ year: yr, target: W.hq.target, ytd: W.hq.ytd, r, commit: W.hq.commit });
  fire(W, s, 'hq', text, W.hq.commit === 'full' ? '연초에 본사 요구를 그대로 받았습니다' : null);
  W.hq.ytd = 0; W.hq.target = 0;
}

/* ============================================================
   결정의 영향 — 지난달 결재가 실제로 무엇을 움직였나
   ============================================================ */
function settleImpacts(s, W, R, before) {
  const T = Object.values(R.shipped || {}).reduce((a, b) => a + b, 0);
  const rows = W.impacts.map(im => {
    const out = [];
    if (im.vol && im.vol !== 1) {
      const dt = T * (1 - 1 / im.vol);
      out.push([dt >= 0 ? '+' : '−', `판매량 ${dt >= 0 ? '+' : '−'}${fmt(Math.abs(dt))}t`]);
      out.push([dt >= 0 ? '=' : '=', `가동률 ${dt >= 0 ? '+' : '−'}${(Math.abs(R.util * (1 - 1 / im.vol)) * 100).toFixed(1)}%p`]);
    }
    if (im.cut) {
      const [k, x] = im.cut, sh = s.custShare[k] || 0;
      out.push(['−', `${CUST[k]} 단가 −$${x}/t`]);
      out.push(['−', `월 이익 −$${fmt(x * T * sh / 1000)}k`]);
    }
    if (im.order && im.order !== 1) out.push([im.order > 1 ? '=' : '+', `소재 발주 ×${im.order}`]);
    if (im.cash) out.push([im.cash > 0 ? '+' : '−', `현금 ${im.cash > 0 ? '+' : '−'}$${fmt(Math.abs(im.cash) / 1000)}k`]);
    if (im.rel) for (const [k, d] of im.rel) {
      const was = before.rel[k], now = W.rel[k];
      out.push([d >= 0 ? '+' : '−', `${CUST[k]} 관계 ${relLabel(was)}${relLabel(was) !== relLabel(now) ? ' → ' + relLabel(now) : ''} (${d >= 0 ? '+' : ''}${d})`]);
    }
    if (im.trust) out.push([im.trust > 0 ? '+' : '−', `본사 신뢰 ${im.trust > 0 ? '+' : ''}${im.trust}`]);
    if (im.equip) out.push([im.equip > 0 ? '+' : '−', `설비 ${equipLabel(before.equip)} → ${equipLabel(W.equip)}`]);
    if (im.quality) out.push([im.quality > 0 ? '+' : '−', `품질 ${im.quality > 0 ? '개선 중' : '저하'}`]);
    if (im.fatigue) out.push([im.fatigue > 0 ? '−' : '+', `현장 ${fatigueLabel(W.fatigue)}`]);
    if (im.risk) out.push(['?', im.risk]);
    return { label: im.label, rows: out };
  }).filter(x => x.rows.length);
  W.lastImpacts = rows;
  W.impacts = [];
}

/* 매달 대시보드용 스냅샷 */
function snapshot(s, W, R) {
  const T = R ? Object.values(R.shipped || {}).reduce((a, b) => a + b, 0) : 0;
  let relAvg = 0;
  for (const k in CUST) relAvg += (s.custShare[k] || 0) * W.rel[k];
  return {
    turn: s.turn, sales: T, op: R ? R.op : 0, cash: s.cash,
    raw: s.invRaw.reduce((a, l) => a + l.qty, 0), util: R ? R.util : 0,
    quality: qualityPct(W.quality), equip: W.equip, rel: relAvg, trust: s.trust,
    morale: s.morale, hqPace: W.hq.target > 0 ? W.hq.ytd / (W.hq.target * (((s.turn - 1) % 12) + 1) / 12) : null,
  };
}

/* ============================================================
   부서 보고 — 같은 회사를 보는데 부서마다 보이는 게 다르다.
   확인된 것, 추정, 소문이 섞여 있다. 소문은 틀릴 수 있다.
   ============================================================ */
function briefing(s, W) {
  const L = look(s), cov = coverOf(s), run = runway(s);
  const out = [];
  const say = (who, kind, text, w) => out.push({ who, kind, text, w });

  // 생산 — 구 공장장. 숫자를 직접 본다. 대신 괜찮을 때는 말이 없다.
  if (W.equip < 48) say('gu', '확인', `2호 라인 진동 수치가 평소보다 높습니다. 베어링 쪽입니다. 마지막 정비가 ${W.maintAge}개월 전입니다.`, 9);
  else if (W.equip < 62) say('gu', wChance(0.8) ? '추정' : '소문', `라인 소리가 좀 달라졌습니다. 당장은 괜찮은데, 오래는 모르겠습니다.`, 6);
  else if (wChance(0.12)) say('gu', '추정', `슬리터 나이프 쪽이 좀 신경 쓰입니다. 큰일은 아닙니다.`, 3);   // 가끔은 헛걱정
  if (W.fatigue > 35) say('gu', '확인', `반장들이 지쳐 있습니다. 석 달째 특근입니다.`, 7);

  // 구매 — 서 대리. 창고는 정확히 알고, 본사 가격은 소문으로 듣는다.
  if (W.priceRumor === 1) say('seo', '소문', `본사 쪽에서 다음 분기 소재값을 올린다는 얘기가 돕니다. 확정은 아니고요…`, 6);
  else if (W.priceRumor === -1) say('seo', '소문', `본사 재고가 많이 쌓였다고, 다음 분기엔 값이 내려갈 수도 있다는데요…`, 6);
  if (cov < 2.4) say('seo', '확인', `창고랑 바다 위 물량을 합쳐도 ${cov.toFixed(1)}개월치밖에 안 됩니다. 좀 불안합니다.`, 9);
  else if (cov > 4.6) say('seo', '확인', `창고랑 바다 위 합쳐서 ${cov.toFixed(1)}개월치입니다. 많이 들고 있습니다.`, 6);

  // 영업 — 정 과장. 시장 소문을 제일 먼저 듣는데, 부풀린다.
  const ks = Object.keys(CUST).filter(k => (s.custShare[k] || 0) > 0.06);
  const rumK = ks.find(k => W.threat[k] ? wChance(0.75) : wChance(0.08));
  if (rumK) say('jung', '소문', `${cname(rumK)}에 경쟁사가 톤당 $${wPick([15, 18, 20, 25])} 낮게 들어갔다는 얘기가 있습니다.`, 8);
  const cold = ks.filter(k => W.rel[k] < 50).sort((a, b) => W.rel[a] - W.rel[b])[0];
  if (cold) say('jung', '추정', `${cname(cold)} 구매팀 분위기가 싸늘합니다. 전화를 잘 안 받습니다.`, 7);
  const warm = ks.find(k => W.relHigh[k] >= 2);
  if (warm && wChance(0.6)) say('jung', '추정', `${cname(warm)} 쪽은 요즘 우리한테 호의적입니다. 뭔가 더 맡길 눈치입니다.`, 5);

  // 재무 — 한 대리. 숫자만 말한다. 틀리지 않는다.
  if (run < 1.6) say('han', '확인', `결론부터 말씀드리면, 지금 현금과 한도로 버틸 수 있는 건 ${run.toFixed(1)}개월입니다. 큰 구매는 부담입니다.`, 9);
  const delayed = s.ar.filter(a => a.delayed).reduce((a, x) => a + x.amount, 0);
  if (delayed > 500_000) say('han', '확인', `대금이 늦어지는 곳이 있습니다. 밀린 게 $${fmt(delayed / 1000)}k입니다.`, 6);
  const topK = topCust(s);
  if ((s.custShare[topK] || 0) > 0.45) say('han', '확인', `${cname(topK)} 비중이 ${Math.round(s.custShare[topK] * 100)}%입니다. 한 곳이 흔들리면 회사가 흔들립니다.`, 6);

  // 품질 — 오 과장. 추세를 본다.
  const qs = W.snaps.slice(-3).map(x => x.quality);
  if (W.quality < 66) say('oh', '확인', `불량률이 올라가고 있습니다. 최근 ${CUST[topK]}향 제품에서 미세 표면 결함이 늘었습니다.`, 8);
  else if (qs.length === 3 && qs[2] < qs[0] - 0.25) say('oh', '추정', `석 달째 품질 지표가 조금씩 내려갑니다. 아직 고객은 모릅니다.`, 6);

  // 현지 — 린 매니저. 사람 얘기.
  if (s.morale < 50) say('lin', '추정', `사장님, 현장 분위기가 안 좋아요. 옆 공단 얘기를 하는 사람이 늘었어요.`, 7);

  // 본사 목표
  if (W.hq.target > 0) {
    const m = ((s.turn - 1) % 12);
    const pace = m > 0 ? W.hq.ytd / (W.hq.target * m / 12) : 1;
    if (m >= 4 && pace < 0.88) say('jung', '확인', `올해 본사 소재 목표 대비 ${Math.round(pace * 100)}% 페이스입니다. 본사가 눈치를 줍니다.`, 7);
  }

  out.sort((a, b) => b.w - a.w);
  const seen = new Set(), pickN = [];
  for (const x of out) { if (pickN.length >= 5) break; if (seen.has(x.who) && pickN.length >= 3) continue; seen.add(x.who); pickN.push(x); }
  if (!pickN.length) pickN.push({ who: 'han', kind: '확인', text: '이번 달은 특별히 보고드릴 게 없습니다. 조용한 달입니다.' });
  return pickN;
}

/* ============================================================
   조기 경보 — 숫자는 이미 알고 있다. 사장이 못 본 척할 뿐이다.
   ============================================================ */
function warnings(s, W) {
  const out = [];
  const u3 = W.utilHist.slice(-3);
  if (u3.length === 3 && u3.every(u => u > 0.9))
    out.push(['생산', '가동률이 3개월 연속 90%를 넘었습니다. 설비 고장과 품질 위험이 쌓이고 있습니다.']);
  if (W.equip < 50) out.push(['설비', `설비 상태 ${equipLabel(W.equip)}. 마지막 정비 후 ${W.maintAge}개월째입니다.`]);
  const c = W.coverHist.slice(-3);
  if (c.length === 3 && c[2] > c[0] + 0.6 && c[2] > 4) out.push(['재무', '소재 재고가 빠르게 늘고 있습니다. 현금이 창고에 묶이고 있습니다.']);
  if (coverOf(s) < 2.3 && s.turn > 3) out.push(['구매', '석 달 뒤 소재가 모자랄 수 있습니다. 결품이면 큰 고객부터 등을 돌립니다.']);
  for (const k in CUST) {
    const h = W.shareHist[k].slice(-4);
    if (h.length === 4 && h[3] < h[0] * 0.88 && (s.custShare[k] || 0) > 0.06)
      out.push(['고객', `${cname(k)} 주문이 줄고 있습니다. 경쟁사로 옮기는 중일 수 있습니다.`]);
  }
  if (W.quality < 66) out.push(['품질', '클레임이 날 수 있는 수준입니다.']);
  if (W.fatigue > 55) out.push(['조직', '현장이 한계입니다. 사람이 나가기 시작하면 캐파가 빠집니다.']);
  const r = runway(s);
  if (r < 1.3) out.push(['현금', `현금과 한도로 ${r.toFixed(1)}개월치입니다.`]);
  const tk = topCust(s);
  if ((s.custShare[tk] || 0) > 0.48) out.push(['고객', `${cname(tk)} 의존도 ${Math.round(s.custShare[tk] * 100)}%. 가격 협상력이 약해집니다.`]);
  if (W.hq.target > 0) {
    const m = ((s.turn - 1) % 12);
    const pace = m > 0 ? W.hq.ytd / (W.hq.target * m / 12) : 1;
    if (m >= 5 && pace < 0.85) out.push(['본사', `올해 소재 판매 목표 대비 ${Math.round(pace * 100)}% 페이스입니다.`]);
  }
  return out;
}

/* ============================================================
   4년 뒤 — 점수 대신 "당신이 만든 회사"를 보여준다
   ============================================================ */
const STYLE_NAME = { grow: '공격적 성장형', cash: '안정적 수익형', cust: '고객관계형', craft: '생산효율형', hq: '본사 충성형' };
const STYLE_OPEN = {
  grow: '당신은 물량을 먼저 잡는 쪽을 택했습니다. 가격을 양보하고 제안을 받아들이며 판매량을 빠르게 키웠습니다.',
  cash: '당신은 현금과 마진을 먼저 지켰습니다. 무리한 물량은 사양하고 재고를 가볍게 들고 갔습니다.',
  cust: '당신은 고객과의 관계에 공을 들였습니다. 요구를 들어주고 직접 찾아가며 거래를 지켰습니다.',
  craft: '당신은 설비와 사람에 먼저 투자했습니다. 라인을 세우는 비용을 감수하며 공장을 건강하게 유지했습니다.',
  hq: '당신은 본사의 요구를 우선했습니다. 목표를 그대로 받고 본사 소재 판매를 늘리는 데 힘을 썼습니다.',
};
const STYLE_NEXT = {
  grow: '다음 판에는 물량 제안 몇 개를 사양하고, 라인을 쉬게 해보면 무엇이 달라지는지 보십시오.',
  cash: '다음 판에는 한두 번 크게 걸어보십시오. 안전하게만 가면 본사와 고객이 먼저 떠납니다.',
  cust: '다음 판에는 한 번쯤 가격 요구를 거절해 보십시오. 양보는 기억되고, 다시 옵니다.',
  craft: '다음 판에는 성장 기회를 더 잡아보십시오. 건강한 공장이 돈을 버는 공장과 같지는 않습니다.',
  hq: '다음 판에는 본사에 한 번 "안 됩니다"라고 해보십시오. 코일센터가 먼저 살아 있어야 합니다.',
};

function companyProfile(s, W) {
  const h = s.history, st = W.stats;
  const tons = h.reduce((a, r) => a + Object.values(r.shipped || {}).reduce((x, y) => x + y, 0), 0);
  const op = h.reduce((a, r) => a + r.op, 0);
  const invAvg = h.reduce((a, r) => a + (r.invTons || 0), 0) / Math.max(1, h.length);
  const years = Math.max(1, h.length / 12);
  const tk = topCust(s);
  const m = {
    tons, op, margin: tons > 0 ? op / tons : 0, hqTons: s.hq.cumMaterialTons,
    util: st.months ? st.utilSum / st.months : 0, quality: qualityPct(st.months ? st.qualSum / st.months : W.quality),
    // L/C는 선적 때 대금이 나가니 바다 위 물량도 우리 재고다. 미착 포함 개월수로 회전을 잰다
    turnover: W.coverHist.length ? 12 / (W.coverHist.reduce((a, b) => a + b, 0) / W.coverHist.length) : 0, cash: s.cash, trust: s.trust, morale: s.morale,
    topK: tk, topShare: s.custShare[tk] || 0,
  };
  const order = Object.keys(STYLE_NAME).sort((a, b) => (W.style[b] || 0) - (W.style[a] || 0));
  const main = order[0], sub = order[1];
  const lines = [STYLE_OPEN[main]];
  if (s.overReason && s.overReason !== "COMPLETE")
    lines.unshift(`회사는 ${h.length}개월 만에 자금이 끊겼습니다. 아래는 그때까지 당신이 만든 회사입니다.`);
  const but = [];
  if (st.overloadMonths >= 8) but.push(`가동률 90% 넘는 달이 ${st.overloadMonths}개월이었고, 그동안 설비와 품질에 부담이 쌓였습니다`);
  if (st.breakdowns >= 2) but.push(`설비가 ${st.breakdowns}번 섰습니다`);
  if (st.claims >= 2) but.push(`품질 클레임이 ${st.claims}건 들어왔습니다`);
  if (st.concessions >= 4) but.push(`가격을 ${st.concessions}번 양보했고, 양보한 고객은 다시 찾아왔습니다`);
  if (m.topShare > 0.45) but.push(`마지막 해에는 ${cname(tk)} 의존도가 ${Math.round(m.topShare * 100)}%까지 올라 협상력이 약해졌습니다`);
  if (st.cashTight >= 6) but.push(`현금이 빠듯한 달이 ${st.cashTight}개월이었습니다`);
  if (st.shortages >= 3) but.push(`납기를 ${st.shortages}번 못 맞췄습니다`);
  if (st.churn >= 3) but.push(`고객 물량이 ${st.churn}번 경쟁사로 빠졌습니다`);
  if (st.hqMiss >= 1) but.push(`본사 연간 목표를 ${st.hqMiss}번 크게 못 채웠습니다`);
  const good = [];
  if (st.breakdowns === 0) good.push('설비는 한 번도 서지 않았습니다');
  if (m.quality >= 97.8) good.push(`평균 양품률 ${m.quality.toFixed(1)}%로 품질은 끝까지 좋았습니다`);
  if (st.hqHit >= 2) good.push(`본사 연간 목표를 ${st.hqHit}번 채웠습니다`);
  if (m.margin > 12) good.push(`톤당 평균 영업이익 $${m.margin.toFixed(1)}로 마진이 두꺼웠습니다`);
  if (m.turnover > 3.2) good.push(`재고를 연 ${m.turnover.toFixed(1)}회 돌려 현금이 창고에 오래 머물지 않았습니다`);
  if (good.length) lines.push(`그 결과 ${good.slice(0, 2).join(". ")}.`);
  if (but.length) lines.push(`그러나 ${but.slice(0, 3).join('. ')}.`);
  if (sub && (W.style[sub] || 0) > (W.style[main] || 0) * 0.6)
    lines.push(`한편으로는 ${STYLE_NAME[sub]}의 모습도 강했습니다.`);
  lines.push(STYLE_NEXT[main]);
  return { main, sub, name: STYLE_NAME[main], lines, m, st };
}
</script>
<script>
/* ============================================================
   issues.js — 이번 달 안건

   고정된 카드 더미에서 뽑지 않는다. 지금 회사 상태와 지난 결정들이 안건을 만든다.
   정비를 미뤘으면 고장 안건이, 가격을 깎아줬으면 또 깎아달라는 안건이,
   재고를 쌓았으면 현금 안건이 올라온다. 조용한 달에는 기회가 올라온다.

   모든 선택지는 뭔가를 얻고 뭔가를 잃는다. 정답 선택지는 없다.
   ============================================================ */

/* 우선순위: force는 무조건 올라오는 것(사고·연간 협상), 나머지는 prio 순 */
function worldIssues(s, W, G) {
  const L = look(s);
  const cov = coverOf(s), run = runway(s);
  const u3 = W.utilHist.slice(-3);
  const hot = u3.filter(u => u > 0.9).length;
  const list = [];
  const add = (card, prio, force = false) => { if (card) list.push({ card, prio, force }); };
  const since = id => s.turn - (G.seen[id] ?? -99);
  const month = (s.turn - 1) % 12;          // 0 = 1월
  const shares = Object.keys(CUST).filter(k => (s.custShare[k] || 0) > 0.06);

  /* ---------- 반드시 올라오는 것 ---------- */
  if (W.breakdown && W.breakdown.turn <= s.turn) add(breakdownCard(s, W), 100, true);
  if (W.claim && W.claim.turn <= s.turn) add(claimCard(s, W, W.claim.cust), 96, true);
  if (month === 0) add(hqAnnualCard(s, W, L), 98, true);
  if (s.turn === 1) add(legacyCard(s, W), 94, true);

  /* ---------- 과거 결정이 만든 문제 ---------- */
  if (cov < 2.2 && s.turn > 2 && since('w-short') > 1) add(shortCard(s, W, L, cov), 88);
  if (run < 1.3 && s.turn > 3 && since('w-cash') > 2) add(cashCard(s, W, run), 90);
  if ((cov > 4.8 || inventoryTons(s) > CFG.WAREHOUSE_CAP_BASE * 0.85) && since('w-over') > 3) add(overCard(s, W, cov), 72);
  if ((W.equip < 60 || W.maintAge >= 9) && since('w-maint') > 2)
    add(maintCard(s, W), 50 + Math.max(0, 60 - W.equip) * 2 + W.deferMaint * 8);
  if (hot >= 2 && W.fatigue > 22 && since('w-load') > 4) add(overloadCard(s, W, hot), 76);
  if ((W.quality < 70 || qualDrop(W) > 0.25) && since('w-qual') > 3) add(qualityCard(s, W), 50 + Math.max(0, 70 - W.quality) * 2);
  if ((W.fatigue > 50 || s.morale < 45) && since('w-people') > 4) add(peopleCard(s, W), 62);
  if (month === 6 && W.hq.target > 0 && W.hq.ytd < W.hq.target * 0.5 * 0.92) add(hqMidCard(s, W), 84);

  /* ---------- 고객 ---------- */
  for (const k of shares) {
    // 한 번 깎아준 고객은 다시 온다. 경쟁사가 붙은 고객도 온다.
    const pressure = W.concede[k] > 0 && since('w-price-' + k) >= 4
      || (W.comp > 45 && W.rel[k] < 62 && since('w-price-' + k) > 4);
    if (pressure && wChance(0.3 + W.concede[k] * 0.12)) add(priceCard(s, W, k), 58 + W.concede[k] * 10);
    if (W.rel[k] < 42 && since('w-churn-' + k) > 4) add(churnCard(s, W, k), 80);
    if (W.relHigh[k] >= 3 && since('w-proj') > 10) add(projectCard(s, W, k, L), 78);
  }
  const volK = shares.filter(k => W.rel[k] >= 60).sort(() => Math.random() - 0.5)[0];
  if (volK && s.market.phase !== 'BUST' && s.turn > 4 && since('w-vol') > 3 && (W.utilHist.slice(-1)[0] ?? 0) < 0.95 && wChance(0.5))
    add(volumeCard(s, W, volK, L), 46);

  /* ---------- 운영 ---------- */
  if (L.isBust && L.quota > 0 && since('op-hq') > 1) add(hqCard(L, s), 60);
  const ex = s.lines.length < CFG.MAX_LINES
    ? (L.gapSlit > 800 ? 'SLIT' : L.gapLevel > 500 ? 'LEVEL'
      : (s.turn > 10 && !s.lines.some(l => l.type === 'BLANK') ? 'BLANK' : null)) : null;
  if (ex && !(s.buildQueue || []).length && since('op-expand') > 6) add(expandCard(ex, L, s), 45);
  if (u3.length === 3 && u3.every(u => u < 0.55) && since('w-idle') > 4) add(idleCard(s, W), 52);
  if (G.trim && s.lines.some(l => l.type === 'SLIT') && since('op-trim') > 6) add(trimCard(), 28);

  /* ---------- 구매 방침과 소문 ---------- */
  if (W.priceRumor && W.priceRumor !== 0 && s.turn % 3 === 1 && since('w-rumor') > 2) add(rumorCard(s, W), 50);
  if (s.turn === 2 || since('w-policy') >= 8) add(policyCard(s, W, cov), 38);

  /* ---------- 조용할 때 ---------- */
  if ((s.turn - (G.lastCust ?? -99)) >= (G.mpt > 1 ? 2 : 5)) add(custFocusCard(s, W), 34);
  if (s.turn > 8 && since('w-credit') > 9 && wChance(0.25)) add(creditCard(s, W), 30);

  return list;
}

function qualDrop(W) {
  const q = W.snaps.slice(-3).map(x => x.quality);
  return q.length === 3 ? q[0] - q[2] : 0;
}

/* ============================================================
   사고 — 정비를 미룬 만큼, 무리한 만큼 온다
   ============================================================ */
function breakdownCard(s, W) {
  const why = cause(W, s, ['defer', 'volume', 'project', 'overtime']);
  const hot = W.utilHist.slice(-4).filter(u => u > 0.9).length;
  const sev = W.breakdown.sev;
  const lineNo = wPick(['1호', '2호']);
  const ctx = [
    why ? `${why} 이후로 무리하게 돌렸습니다.` : '',
    hot >= 2 ? `최근 넉 달 중 ${hot}달을 가동률 90% 넘게 돌렸습니다.` : '',
    W.deferMaint >= 1 ? `정비는 ${W.maintAge}개월째 못 했습니다.` : '',
  ].filter(Boolean).join(' ');
  const done = (s, G, cap, cost, eq, msg, tag) => {
    W.capHit *= cap; s.cash -= cost; W.equip = wClamp(W.equip + eq);
    W.breakdown = null; W.stats.breakdowns++;
    for (const k of Object.keys(CUST).sort((a, b) => (s.custShare[b] || 0) - (s.custShare[a] || 0)).slice(0, 2))
      W.rel[k] = wClamp(W.rel[k] - (cap < 0.75 ? 6 : 3));
    remember(W, s, 'breakdown', `${lineNo} 라인 고장`);
    if (tag) remember(W, s, tag, msg);
    lever(G, `${lineNo} 라인 고장 수리`, { cash: -cost, equip: eq, risk: cap < 0.75 ? '이번 달 캐파 크게 감소' : '이번 달 캐파 감소' });
    return msg;
  };
  return {
    id: 'w-break', who: 'gu', topic: 'prod',
    title: `${lineNo} 라인이 섰습니다`,
    text: [`어젯밤 ${lineNo} 라인 감속기가 나갔습니다.`, sev > 1 ? '크게 나갔습니다.' : '', ctx, '어떻게 고칠지 정해주십시오.'].filter(Boolean).join(' '),
    opts: [
      { label: '제작사 기술자를 불러 급히 고친다', hint: '돈으로 시간을 산다',
        fx: [`−통장 $${sev > 1 ? 320 : 200},000`, '+이번 달 캐파 손실 최소', '+설비 상태 회복'],
        apply: (s, G) => done(s, G, 0.9, sev > 1 ? 320_000 : 200_000, 18,
          '제작사 기술자가 이틀 만에 고쳤습니다. 비쌌지만 라인은 거의 안 쉬었습니다.') },
      { label: '우리 인력으로 고친다', hint: '돈은 덜 드는데 오래 선다',
        fx: [`−통장 $${sev > 1 ? 140 : 90},000`, '−이번 달 캐파 30% 손실', '−납기 지연 → 고객 불만'],
        apply: (s, G) => done(s, G, 0.68, sev > 1 ? 140_000 : 90_000, 10,
          '열흘을 섰습니다. 그동안 큰 고객 두 곳 납기를 못 맞췄습니다.') },
      { label: '임시로 돌려놓고 나중에 제대로', hint: '당장은 싸다',
        fx: ['−통장 $30,000', '=이번 달 캐파 소폭 손실', '?다시 설 가능성 높음'],
        apply: (s, G) => { W.deferMaint++; W.stats.deferrals++;
          return done(s, G, 0.85, 30_000, 2, '용접으로 붙여놓고 돌립니다. 구 공장장은 "또 설 겁니다"라고 했습니다.', 'defer'); } },
    ],
  };
}

function claimCard(s, W, k) {
  // 그 고객에게 물량을 몰아준 게 제일 직접적인 원인이다. 없으면 공장 쪽 원인을 찾는다.
  const why = cause(W, s, ['volume', 'project'], k) || cause(W, s, ['outsource', 'overtime', 'defer', 'skipqual']);
  const amt = Math.round((80 + (s.custShare[k] || 0) * 400) / 10) * 10;   // $천
  const done = (s, G, cost, rel, trust, share, msg, tag) => {
    s.cash -= cost; W.rel[k] = wClamp(W.rel[k] + rel); s.trust = wClamp(s.trust + trust);
    if (share !== 1) growCust(s, k, share - 1);
    W.claim = null; W.stats.claims++;
    remember(W, s, 'claim', `${CUST[k]} 품질 클레임`, { cust: k });
    if (tag) remember(W, s, tag, `${CUST[k]} 클레임 부인`, { cust: k });
    lever(G, `${CUST[k]} 클레임 대응`, { cash: -cost, rel: [[k, rel]], trust: trust || undefined,
      vol: share !== 1 ? 1 + (s.custShare[k] || 0) * (share - 1) : undefined });
    return msg;
  };
  return {
    id: 'w-claim', who: 'oh', topic: 'quality',
    title: `${cname(k)}에서 클레임이 들어왔습니다`,
    text: `${CUST[k]} 프레스 라인에서 우리 코일 표면 결함이 나왔습니다. ${why ? `짚고 넘어가겠습니다. ${why} 이후 우리 품질 지표가 계속 내려왔습니다.` : '최근 품질 지표가 내려와 있던 건 사실입니다.'} 고객은 $${amt}k를 청구했습니다.`,
    opts: [
      { label: '전액 보상하고 원인 보고서까지 낸다', hint: '돈으로 신뢰를 산다',
        fx: [`−통장 $${amt},000`, `+${CUST[k]} 관계 회복`, '+본사 신뢰 3'],
        apply: (s, G) => { W.qBoost += 6; styleAdd(W, 'cust', 2);
          return done(s, G, amt * 1000, 8, 3, 1, `전액 보상하고 8D 보고서를 냈습니다. ${CUST[k]} 품질팀이 오히려 신뢰를 보였습니다.`); } },
      { label: '공동 조사 후 과실 비율대로 나눈다', hint: '원칙대로',
        fx: [`−통장 약 $${Math.round(amt * 0.5)},000`, '?결과에 따라 관계가 갈린다'],
        apply: (s, G) => wChance(0.55)
          ? done(s, G, amt * 400, 2, 0, 1, '공동 조사 결과 절반 이상은 고객 쪽 문제였습니다. 깔끔하게 정리됐습니다.')
          : done(s, G, amt * 700, -6, -2, 1, '조사 결과 우리 쪽 비중이 컸습니다. 돈은 돈대로 들고 시간도 끌었습니다.') },
      { label: '우리 책임이 아니라고 한다', hint: '당장은 공짜',
        fx: ['+비용 없음', `−${CUST[k]} 관계 크게 악화`, `−${CUST[k]} 물량 감소`],
        apply: (s, G) => (styleAdd(W, 'cash'), done(s, G, 0, -16, -3, 0.85,
          `책임을 부인했습니다. ${CUST[k]}가 다음 분기 물량을 다른 코일센터와 나누겠답니다.`, 'deny')) },
    ],
  };
}

/* ============================================================
   연간 — 본사와 코일센터의 이해관계가 정면으로 부딪히는 자리
   ============================================================ */
function hqAnnualCard(s, W, L) {
  const y = Math.min(3, Math.floor((s.turn - 1) / 12));
  const base = L.need * 12 * (s.turn === 1 ? 1.1 : 1);      // 1년차는 파이프라인을 채우는 첫 발주가 목표에 섞인다
  const ask = Math.round(base * HQ_GROWTH[y] / 1000) * 1000;
  const run = runway(s), cov = coverOf(s);
  const util = W.utilHist.length ? W.utilHist.slice(-3).reduce((a, b) => a + b, 0) / Math.min(3, W.utilHist.length) : 0.8;
  const finance = run < 2 ? '현금 여유가 없습니다. 공격적으로 늘리면 운전자금이 먼저 터집니다.'
                : cov > 4 ? '재고가 이미 무겁습니다. 더 사면 창고에 돈이 묶입니다.'
                : '재무적으로는 감당할 만합니다. 다만 마진이 얇아지면 이야기가 달라집니다.';
  const prod = util > 0.88 ? '지금 라인으로는 추가 물량을 감당하기 어렵습니다. 무리하면 설비가 먼저 탈 겁니다.'

/* 1년차 첫 달 — 전임자가 남긴 묵은 재고 */
function legacyCard(s, W) {
  const lot = s.invRaw.find(l => l.arrivalTurn < 0);
  if (!lot) return null;
  const val = lot.qty * s.market.pm;
  const drop = (s, pct, msg, G, label, extra = {}) => {
    const i = s.invRaw.indexOf(lot); if (i >= 0) s.invRaw.splice(i, 1);
    const cash = val * pct; s.cash += cash;
    lever(G, label, { cash: Math.round(cash), ...extra });
    return msg;
  };
  return {
    id: 'w-legacy', who: 'han', topic: 'legacy',
    title: '전임 사장이 남긴 재고가 있습니다',
    text: `결론부터 말씀드리면, 창고 구석에 일반재 ${fmt(lot.qty)}톤이 다섯 달째 묵어 있습니다. 장부가로 $${fmt(val / 1000)}k입니다. `
        + `규격이 애매해서 사겠다는 데가 없었습니다. 더 두면 녹이 슬고, 결국 반값에 넘기게 됩니다.`,
    opts: [
      { label: '지금 싸게 넘긴다', hint: '손실을 확정하고 털어낸다',
        fx: [`+현금 $${fmt(val * 0.72 / 1000)}k 회수`, `−손실 $${fmt(val * 0.28 / 1000)}k 확정`, '+창고 정리'],
        apply: (s, G) => { styleAdd(W, 'cash', 2); remember(W, s, 'cleanup', '묵은 재고 정리');
          return drop(s, 0.72, '고철상 가격보다 조금 나은 값에 넘겼습니다. 아프지만 깨끗해졌습니다.', G, '묵은 재고 헐값 처분'); } },
      { label: '본사에 반품을 협의한다', hint: '본사에 빚을 진다',
        fx: [`+현금 $${fmt(val * 0.9 / 1000)}k 회수`, '−본사 신뢰 7'],
        apply: (s, G) => { s.trust = wClamp(s.trust - 7); styleAdd(W, 'cash');
          remember(W, s, 'hq-favor', '묵은 재고 본사 반품');

      { label: '조금씩 섞어서 팔아본다', hint: '손실을 미룬다',
        fx: ['=당장 손실 없음', '?녹 슬면 반값 처분', '−창고 공간 차지'],

          lever(G, '묵은 재고 보유', { risk: '매달 열화·반값 처분 위험' });
          return '일단 둡니다. 유통 물량 나올 때 섞어서 팔아보겠습니다.'; } },

        apply: (s, G) => { G.mult *= 0.4; W.policy = 'tight'; styleAdd(W, 'cash');

function cashCard(s, W, run) {
  const why = cause(W, s, ['overbuy', 'volume', 'project', 'expand', 'policy-ample', 'hold-stock']);
  const worst = Object.keys(CUST).filter(k => W.cut[k] > 0).sort((a, b) => W.cut[b] - W.cut[a])[0];
  const ar = s.ar.reduce((a, x) => a + x.amount, 0);
  const opts = [
    { label: '매출채권을 할인해서 당겨 받는다', hint: '수수료를 내고 현금을 산다',
      fx: [`+현금 약 $${fmt(ar * 0.35 / 1000)}k`, `−수수료 $${fmt(ar * 0.35 * 0.02 / 1000)}k`],
      apply: (s, G) => { let got = 0;
        for (const a of s.ar.slice().sort((x, y) => x.dueTurn - y.dueTurn)) { if (got > ar * 0.35) break; got += a.amount; a.amount = 0; }
        s.ar = s.ar.filter(a => a.amount > 0); s.cash += got * 0.98; styleAdd(W, 'cash');
        lever(G, '매출채권 할인', { cash: Math.round(got * 0.98) });
        return '채권을 은행에 넘기고 현금을 당겼습니다. 수수료만큼 이익이 줄었습니다.'; } },
    { label: '발주를 절반으로 줄인다', hint: '석 달 뒤를 담보로 지금을 산다',
      fx: ['+현금 유출 ↓', '−발주 ×0.5', '?석 달 뒤 결품'],
      apply: (s, G) => { G.mult *= 0.5; styleAdd(W, 'cash'); remember(W, s, 'underbuy', '현금난에 발주 절반');
        lever(G, '현금난 발주 축소', { order: 0.5, risk: '석 달 뒤 결품 위험' });
        return '발주를 절반으로 줄였습니다. 석 달 뒤가 걱정입니다.'; } },
  ];
  if (worst) opts.unshift({
    label: `${CUST[worst]}의 저수익 물량을 포기한다`, hint: `깎아준 $${W.cut[worst]}/t 물량`,
    fx: ['+마진 회복 · 운전자금 ↓', `−${CUST[worst]} 물량 대폭 감소`, `−${CUST[worst]} 관계 악화`],
    apply: (s, G) => { const v = growCust(s, worst, -0.4); W.cut[worst] = 0; W.rel[worst] = wClamp(W.rel[worst] - 14);
      G.mult *= 0.8; W.stats.dropped++; styleAdd(W, 'cash', 2);
      remember(W, s, 'drop', `${CUST[worst]} 저수익 물량 포기`, { cust: worst });
      lever(G, `${CUST[worst]} 저수익 물량 포기`, { vol: v, rel: [[worst, -14]], order: 0.8 });
      return `${CUST[worst]}에 깎아준 단가를 되돌리겠다고 했더니 물량을 빼겠답니다. 받아들였습니다.`; } });
  return {
    id: 'w-cash', who: 'han', topic: 'cash',
    title: '현금이 바닥을 보입니다',
    text: `결론부터 말씀드리면, 현금과 은행 한도를 다 합쳐 ${run.toFixed(1)}개월치입니다. ${why ? `${why} 결정의 청구서가 지금 돌아오고 있습니다. ` : ''}`
        + `당장 부도는 아니지만, 한 달만 삐끗하면 소재 대금을 못 막습니다. 뭔가를 포기해야 합니다.`,
    opts: opts.slice(0, 3),
  };
}

  const ask = Math.min(18, again ? 8 + W.concede[k] * 3 : 10);
  const dep = (s.custShare[k] || 0) > 0.4;
  const rumor = W.threat[k] ? '실제로 경쟁사 견적서를 들고 왔습니다.' : '경쟁사가 더 싸게 준다고 합니다. 진짜인지는 모르겠습니다.';
  return {
    id: 'w-price-' + k, who: 'jung', topic: 'price',
    title: again ? `${cname(k)}가 또 단가를 깎아달랍니다` : `${cname(k)}가 단가 인하를 요구합니다`,
    text: again
      ? `사장님, ${why || '지난번에'} 깎아줬더니 이번에도 톤당 $${ask}를 더 깎아달랍니다. ${rumor} ${dep ? '우리 물량의 절반 가까이가 거기라, 그쪽도 그걸 압니다.' : ''}`
      : `${cname(k)} 구매팀장이 톤당 $${ask} 인하를 요구합니다. ${rumor} ${dep ? '우리가 거기 없으면 안 된다는 걸 그쪽도 압니다.' : ''}`,
    opts: [
      { label: '요구를 받아준다', hint: '물량과 관계를 지킨다',
        fx: [`−${CUST[k]} 단가 −$${ask}/t (계속 유지)`, `+${CUST[k]} 관계 ↑`, '?다음에 또 요구할 가능성 ↑'],
        apply: (s, G) => { W.cut[k] += ask; W.concede[k]++; W.rel[k] = wClamp(W.rel[k] + 7); W.stats.concessions++;
          styleAdd(W, 'cust'); styleAdd(W, 'grow');
          remember(W, s, 'concede', `${CUST[k]}에 $${ask} 양보`, { cust: k });
          lever(G, `${CUST[k]} 단가 인하 수용`, { cut: [k, ask], rel: [[k, 7]] });
          return `받아줬습니다. ${CUST[k]} 구매팀장이 웃었습니다. 정 과장은 "다음엔 더 세게 올 겁니다"라고 했습니다.`; } },
      { label: '품질·납기 실적을 들고 설득한다', hint: '평소에 쌓은 게 있어야 통한다',
        fx: ['?품질·관계가 좋아야 먹힌다', '+통하면 단가 유지'],
        apply: (s, G) => { const ok = W.quality >= 72 && W.rel[k] >= 55 && wChance(0.75);
          if (ok) { W.rel[k] = wClamp(W.rel[k] + 2); styleAdd(W, 'craft');
            remember(W, s, 'persuade', `${CUST[k]} 품질로 설득`, { cust: k });
            lever(G, `${CUST[k]} 품질로 설득 — 성공`, { rel: [[k, 2]] });
            return `불량률과 납기 준수율 자료를 들고 갔습니다. ${CUST[k]}가 단가를 유지하기로 했습니다. 평소에 쌓은 덕입니다.`; }
          const v = growCust(s, k, -0.12); W.rel[k] = wClamp(W.rel[k] - 6);
          remember(W, s, 'hold', `${CUST[k]} 설득 실패`, { cust: k });
          lever(G, `${CUST[k]} 품질로 설득 — 실패`, { vol: v, rel: [[k, -6]] });
          return `자료를 들고 갔는데 ${W.quality < 72 ? '최근 우리 품질이 오히려 약점이 됐습니다' : '관계가 거기까지 받쳐주지 못했습니다'}. 물량 일부가 빠졌습니다.`; } },
      { label: '거절한다', hint: '마진을 지킨다',
        fx: ['+단가 유지', `?경쟁사가 진짜면 ${CUST[k]} 물량 이탈`],
        apply: (s, G) => { styleAdd(W, 'cash');
          if (W.threat[k]) { const v = growCust(s, k, -0.25); W.rel[k] = wClamp(W.rel[k] - 10);
            remember(W, s, 'hold', `${CUST[k]} 인하 요구 거절`, { cust: k });
            lever(G, `${CUST[k]} 인하 거절 — 이탈`, { vol: v, rel: [[k, -10]] });
            return `거절했습니다. 경쟁사 견적은 진짜였습니다. ${CUST[k]} 물량 4분의 1이 넘어갔습니다.`; }
          W.rel[k] = wClamp(W.rel[k] - 2);
          remember(W, s, 'hold-ok', `${CUST[k]} 인하 요구 거절`, { cust: k });
          lever(G, `${CUST[k]} 인하 거절 — 버팀`, { rel: [[k, -2]] });
          return `거절했습니다. 알고 보니 경쟁사 얘기는 떠본 거였습니다. ${CUST[k]}는 그대로 남았습니다.`; } },
    ],
  };
}

function volumeCard(s, W, k, L) {
  const pct = wPick([0.25, 0.3, 0.35]);
  const cut = wPick([8, 10, 12, 14]);
  const u = W.utilHist.slice(-1)[0] || 0.8;
  const gu = u > 0.85 ? ` 구 공장장은 "지금 라인으로는 벅찹니다"라고 합니다.` : '';
  return {
    id: 'w-vol', who: 'jung', topic: 'vol',
    title: `${cname(k)}가 물량을 더 주겠답니다`,
    text: `사장님, 이거 큽니다! ${CUST[k]}가 물량을 ${Math.round(pct * 100)}% 늘려주겠답니다. 조건은 톤당 $${cut} 인하입니다. `
        + `본사 소재 판매도 같이 늘어납니다.${gu}`,
    opts: [
      { label: '전량 받는다', hint: '성장',
        fx: ['+판매량 ↑ · 본사 소재 판매 ↑', `−${CUST[k]} 단가 −$${cut}/t`, '?가동률 ↑ → 설비·품질 부담'],
        apply: (s, G) => { const v = growCust(s, k, pct); W.cut[k] += cut; W.rel[k] = wClamp(W.rel[k] + 6);
          styleAdd(W, 'grow', 2); styleAdd(W, 'hq');
          remember(W, s, 'volume', `${CUST[k]} 대량 수주`, { cust: k });
          lever(G, `${CUST[k]} 대량 수주`, { vol: v, cut: [k, cut], rel: [[k, 6]], risk: '2~4개월 뒤 설비·품질 부담' });
          return `전량 받았습니다. 석 달쯤 뒤에 라인이 얼마나 버티는지 보게 될 겁니다.`; } },
      { label: '절반만 받는다', hint: '감당할 만큼',
        fx: ['+판매량 조금 ↑', `−${CUST[k]} 단가 −$${Math.round(cut / 2)}/t`],
        apply: (s, G) => { const v = growCust(s, k, pct / 2); W.cut[k] += Math.round(cut / 2); W.rel[k] = wClamp(W.rel[k] + 2);
          styleAdd(W, 'grow'); remember(W, s, 'volume-half', `${CUST[k]} 물량 절반 수주`, { cust: k });
          lever(G, `${CUST[k]} 물량 절반 수주`, { vol: v, cut: [k, Math.round(cut / 2)], rel: [[k, 2]] });
          return '절반만 받기로 했습니다.'; } },
      { label: '정중히 사양한다', hint: '마진과 라인을 지킨다',
        fx: ['+마진·설비 지킴', `−${CUST[k]} 서운함`],
        apply: (s, G) => { W.rel[k] = wClamp(W.rel[k] - 4); styleAdd(W, 'cash'); styleAdd(W, 'craft');
          remember(W, s, 'decline', `${CUST[k]} 추가 물량 사양`, { cust: k });
          lever(G, `${CUST[k]} 추가 물량 사양`, { rel: [[k, -4]] });
          return `사양했습니다. ${CUST[k]}가 다른 코일센터에 물어볼 겁니다.`; } },
    ],
  };
}

function projectCard(s, W, k, L) {
  const u = W.utilHist.slice(-1)[0] || 0.8;
  return {
    id: 'w-proj', who: 'jung', topic: 'vol',
    title: `${cname(k)}가 신차 프로젝트를 맡기고 싶어 합니다`,
    text: `사장님, 그동안 ${CUST[k]}에 잘해온 게 돌아왔습니다. 신차 프로젝트 2년 물량을 우리한테 주고 싶답니다. `
        + `${u > 0.85 ? '다만 지금 라인은 거의 꽉 찼습니다. 받으면 증설이든 특근이든 뭔가 해야 합니다.' : '라인에는 아직 여유가 있습니다.'}`,
    opts: [
      { label: '받는다', hint: '큰 성장', fx: ['+판매량 크게 ↑', '+본사 신뢰 3', '?캐파·현금 부담'],
        apply: (s, G) => { const v = growCust(s, k, 0.4); s.trust = wClamp(s.trust + 3); W.rel[k] = wClamp(W.rel[k] + 5);
          W.stats.projects++; styleAdd(W, 'grow', 2); styleAdd(W, 'cust', 2);
          remember(W, s, 'project', `${CUST[k]} 신차 프로젝트 수주`, { cust: k });
          lever(G, `${CUST[k]} 신차 프로젝트`, { vol: v, trust: 3, rel: [[k, 5]], risk: '캐파가 모자랄 수 있음' });
          return '받았습니다. 2년짜리 물량입니다. 이제 그걸 만들 라인과 소재가 있어야 합니다.'; } },
      { label: '단가를 확실히 받고 받는다', hint: '수익성 우선', fx: ['+판매량 ↑', '+마진 좋음', '?협상 중 일부 놓침'],
        apply: (s, G) => { const v = growCust(s, k, 0.22); W.cut[k] = Math.max(0, W.cut[k] - 8); W.stats.projects++;
          styleAdd(W, 'cash'); styleAdd(W, 'cust');
          remember(W, s, 'project', `${CUST[k]} 신차 프로젝트 조건부 수주`, { cust: k });
          lever(G, `${CUST[k]} 신차 프로젝트 (조건부)`, { vol: v });
          return '단가를 제대로 받는 조건으로 일부를 받았습니다. 예전에 깎아준 것도 일부 돌려받았습니다.'; } },
      { label: '지금은 사양한다', hint: '감당 못 할 약속은 안 한다', fx: ['+부담 없음', `−${CUST[k]} 관계 조금 ↓`],
        apply: (s, G) => { W.rel[k] = wClamp(W.rel[k] - 5); styleAdd(W, 'craft');
          remember(W, s, 'decline', `${CUST[k]} 프로젝트 사양`, { cust: k });
          lever(G, `${CUST[k]} 프로젝트 사양`, { rel: [[k, -5]] });
          return `사양했습니다. ${CUST[k]}는 아쉬워했고, 그 프로젝트는 경쟁사로 갔습니다.`; } },
    ],
  };
}

function churnCard(s, W, k) {
  const why = cause(W, s, ['hold', 'deny', 'claim', 'short', 'cutvol', 'drop'], k) || cause(W, s, ['breakdown', 'short']);
  return {
    id: 'w-churn-' + k, who: 'jung', topic: 'cust',
    title: `${cname(k)} 주문이 계속 줄고 있습니다`,
    text: `석 달째 주문이 줄었습니다. ${why ? `${why} 이후로 분위기가 달라졌습니다. ` : ''}경쟁사가 들어온 것 같습니다. 붙잡을지 놓을지 정해야 합니다.`,
    opts: [
      { label: '사장이 직접 찾아간다', hint: '사람으로 푼다', fx: ['−통장 $40,000', `+${CUST[k]} 관계 회복`],
        apply: (s, G) => { s.cash -= 40_000; W.rel[k] = wClamp(W.rel[k] + 10); styleAdd(W, 'cust', 2);
          remember(W, s, 'visit', `${CUST[k]} 사장 방문`, { cust: k });
          lever(G, `${CUST[k]} 사장 직접 방문`, { cash: -40_000, rel: [[k, 10]] });
          return `${CUST[k]} 구매 임원과 저녁을 했습니다. 서운했던 게 많았다고 합니다. 일단 붙잡았습니다.`; } },
      { label: '단가로 붙잡는다', hint: '확실하지만 비싸다', fx: [`−${CUST[k]} 단가 −$12/t`, `+${CUST[k]} 관계 크게 회복`, '?양보 기억'],
        apply: (s, G) => { W.cut[k] += 12; W.concede[k]++; W.rel[k] = wClamp(W.rel[k] + 18); W.stats.concessions++;
          styleAdd(W, 'cust'); remember(W, s, 'concede', `${CUST[k]} 이탈 방지 단가 인하`, { cust: k });
          lever(G, `${CUST[k]} 단가로 붙잡기`, { cut: [k, 12], rel: [[k, 18]] });
          return '깎아주고 붙잡았습니다.'; } },
      { label: '놓아주고 다른 고객에 집중한다', hint: '정리할 건 정리한다', fx: [`−${CUST[k]} 물량 크게 감소`, '+다른 고객에 영업력 집중'],
        apply: (s, G) => { const v = growCust(s, k, -0.45); W.stats.dropped++; styleAdd(W, 'cash');
          const other = Object.keys(CUST).filter(x => x !== k).sort((a, b) => W.rel[b] - W.rel[a])[0];
          G.ui.custFocus = other;
          remember(W, s, 'drop', `${CUST[k]} 정리`, { cust: k });
          lever(G, `${CUST[k]} 정리, ${CUST[other]} 집중`, { vol: v });
          return `${CUST[k]}는 놓아주고 ${CUST[other]}에 영업을 붙였습니다.`; } },
    ],
  };
}

function custFocusCard(s, W) {
  const card = customerCard(s);
  card.topic = 'cust';
  card.text += ` 참고로 지금 고객별 분위기는 ${Object.keys(CUST).map(k => `${CUST[k]} ${relLabel(W.rel[k])}`).join(', ')}입니다.`;
  card.opts.forEach((o, i) => {
    const k = Object.keys(CFG.CUSTOMERS)[i];
    o.hint = `지금 거래의 ${Math.round((s.custShare[k] || 0) * 100)}% · 관계 ${relLabel(W.rel[k])}`;
    const inner = o.apply;
    o.apply = (st, G) => { W.rel[k] = wClamp(W.rel[k] + 5); styleAdd(W, 'cust');
      remember(W, st, 'focus', `${CUST[k]} 집중 영업`, { cust: k });
      lever(G, `${CUST[k]} 집중 영업`, { rel: [[k, 5]], risk: '효과는 석 달 뒤' });
      return inner(st, G); };
  });
  return card;
}

function creditCard(s, W) {
  const cands = Object.keys(CUST).filter(k => (s.custShare[k] || 0) > 0.06);
  const k = wPick(cands);
  const risky = CFG.CUSTOMERS[k].bad > 0.005;
  return {
    id: 'w-credit', who: 'han', topic: 'credit',
    title: `${cname(k)}가 여신 한도를 올려달랍니다`,
    text: `지금 한도로는 더 못 받겠답니다. 숫자만 보고 말씀드리면, 올려주면 물량이 늘고 안 올려주면 줍니다. `
        + `${risky ? '이 고객군은 대금이 밀린 이력이 업계에 좀 있습니다.' : '이 고객군은 대금은 잘 줍니다.'}`,
    opts: [
      { label: '올려준다', hint: '믿고 간다', fx: ['+물량 ↑', `+${CUST[k]} 관계 ↑`, `?${risky ? '떼일 위험 높음' : '떼일 위험 낮음'}`],
        apply: (s, G) => { const v = growCust(s, k, 0.15); W.rel[k] = wClamp(W.rel[k] + 5); styleAdd(W, 'grow');
          const p = risky ? 0.4 : 0.1;
          G.pending.push({ turn: s.turn + 6, run: s2 => {
            if (Math.random() < p) { s2.cash -= 1_600_000; W.rel[k] = wClamp(W.rel[k] - 10);
              fire(W, s2, 'bad', `${CUST[k]}가 대금을 못 갚았습니다. $1,600k를 털었습니다.`, `여섯 달 전 ${CUST[k]} 여신 확대`);
              return `${CUST[k]} 대금 $1,600k를 떼였습니다.`; }
            return null; } });
          remember(W, s, 'credit', `${CUST[k]} 여신 확대`, { cust: k });
          lever(G, `${CUST[k]} 여신 확대`, { vol: v, rel: [[k, 5]], risk: '6개월 뒤 대손 가능성' });
          return '한도를 올렸습니다. 한 대리 표정이 굳었습니다.'; } },
      { label: '보증보험을 끼고 올려준다', hint: '안전하게', fx: ['−통장 $30,000', '+물량 조금 ↑'],
        apply: (s, G) => { s.cash -= 30_000; const v = growCust(s, k, 0.07); styleAdd(W, 'cash');
          lever(G, `${CUST[k]} 여신 (보증)`, { vol: v, cash: -30_000 });
          return '보증보험을 끼고 올렸습니다.'; } },
      { label: '거절한다', hint: '떼일 일은 없다', fx: ['+대손 없음', `−${CUST[k]} 물량 ↓`],
        apply: (s, G) => { const v = growCust(s, k, -0.08); W.rel[k] = wClamp(W.rel[k] - 4); styleAdd(W, 'cash');
          lever(G, `${CUST[k]} 여신 거절`, { vol: v, rel: [[k, -4]] });
          return '거절했습니다. 밤에 잠은 잘 옵니다.'; } },
    ],
  };
}
</script>
<script>
/* 그림 26장을 data URI로 심어둔다. 이게 있으면 index.html 하나만으로 돈다.

<script>
/* ============================================================
   코일센터 경영 시뮬레이터 · 화면
   engine.js의 계산 위에 얹는 껍데기. 규칙은 여기서 만들지 않는다.
   ============================================================ */

const $ = s => document.querySelector(s);
const app = $('#app');
const fmt = n => Math.round(n).toLocaleString('en-US');
const money = n => (n < 0 ? '−$' : '$') + fmt(Math.abs(n));
const M = n => (n < 0 ? '−$' : '$') + (Math.abs(n) / 1e6).toFixed(1) + 'M';

const CAST = {
  seo:  { face: '📋', img: 'cast_seo',  name: '서 대리',   role: '구매' },
  jung: { face: '📞', img: 'cast_jung', name: '정 과장',   role: '영업' },
  gu:   { face: '🔧', img: 'cast_gu',   name: '구 공장장', role: '생산' },
  han:  { face: '🧮', img: 'cast_han',  name: '한 대리',   role: '경리' },
  oh:   { face: '🔍', img: 'cast_oh',   name: '오 과장',   role: '품질' },
  lin:  { face: '☕', img: 'cast_lin',  name: '린 매니저', role: '현지' },
};

/* 말풍선 얼굴. 초상 이미지가 있으면 그걸 쓰고, 없으면 이모지로 돌아간다. */
function face(p) {
  const m = typeof p === 'string' ? CAST[p] : p;
  if (!m) return '';
  return m.img ? `<img class="facepic" src="${A(m.img + `.png`)}" alt="">` : m.face;
}

/* 출발 조건은 모두 같다. 국가·설비·자본금이 다르면 성적 차이가 판단의 차이인지
   출발점의 차이인지 가릴 수 없다. 교육용이니 판단만 남긴다. */
const COUNTRIES = {
  NV: { name: '노바리아', emoji: '🏳️', desc: '자동차 산업이 막 커지기 시작한 가상의 신흥국입니다.' },
};
/* 난이도. 하드는 자본도 얇고 물려받은 판매 기반도 작다.
   같은 판단을 해도 실수 한 번의 값이 다르다. */
const DIFF = {
  normal: { key:'normal', name:'노멀', equity:65_000_000, share:0.10, debtRate:0.60,
    target:45_000_000, trust:65,
    desc:'자본금 $65M. 본사가 붙여준 판매 기반도 넉넉합니다. 판단을 배우기에 좋습니다.' },
  hard:   { key:'hard',   name:'하드', equity:55_000_000, share:0.082, debtRate:0.55,
    target:58_000_000, trust:55,
    desc:'자본금 $55M. 은행 한도도 좁고 물려받은 고객도 적습니다. 첫 1년을 버티는 것부터 일입니다.' },
};
const SETUP = { country: 'NV', lines: ['SLIT', 'LEVEL'], diff: 'normal' };

let G = null;

/* ============================================================
   돌발 이벤트 — 각 선택지는 상태를 직접 바꾼다.
   나중에 터지는 것은 G.pending에 넣어 몇 달 뒤에 청구된다.
   ============================================================ */

/* ---------- 시작 ---------- */
function newGame(opt) {
  const D = DIFF[opt.diff] || DIFF.normal;
  const s = createInitialState({
    seed: (Math.random() * 1e9) | 0,
    equity: D.equity, debtLimit: Math.round(D.equity * D.debtRate),
    myShare: D.share, trust: D.trust,
    lines: opt.lines, country: opt.country, companyName: opt.name,
  });
  /* 노멀은 매달, 속성은 분기마다 결재한다. 속성은 카드 한 벌로 석 달을 한 번에 돌린다.
     48개월 ÷ 3 = 16번이면 끝난다. */
  const mpt = opt.mode === 'quick' ? 3 : 1;
  G = { s, mode: opt.mode || 'normal', mpt, diff: D,
        ui: { cover: 1, hqTake: 0, expandPick: null, overtime: false, yieldSpend: 0, salesSpend: 0 },
        pending: [], seen: {}, cards: {}, picks: {},
        turnDiscount: 0, yieldPenalty: 0, extraFixed: 0 };

  /* 숨은 세계 — 설비·품질·고객 관계·본사 목표. 플레이어는 징후로만 본다. */
  G.W = initWorld(s, D);
  applyLegacy(s);
  G.W.snaps.push(snapshot(s, G.W, null));

  /* 대형 사건은 판마다 다른 달에, 다른 조합으로 온다.
     지금은 대부분의 사건이 플레이어의 선택에서 나오므로, 외부 충격은 세 건만 둔다. */
  G.bigPlan = {};
  const bigs = DECK.big.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  const used = [];
  for (const b of bigs) {
    for (let tries = 0; tries < 300; tries++) {
      let m = 6 + Math.floor(Math.random() * (CFG.TOTAL_TURNS - 8));
      // 속성 모드는 분기 첫 달에만 결재하므로, 사건도 그 달로 당겨 놓는다
      if (mpt > 1) m = m - ((m - 1) % mpt);
      if (used.every(u => Math.abs(u - m) >= 5)) { used.push(m); G.bigPlan[m] = b; break; }
    }
  }

  render();
}

/* 이번 달 안건을 짠다.
   고정 덱에서 뽑지 않는다. 회사 상태와 지난 결정이 안건을 올리고(issues.js),
   그중 급한 것부터 서너 건만 사장 책상에 올라온다. 같은 주제는 한 번만. */
function dealTurn() {
  G.trim = trimOptions(Math.random);
  G.trimPick = 0;
  G.cards = {}; G.picks = {};
  G.queue = []; G.qi = 0; G.mult = 1; G.done = [];

  const s = G.s, W = G.W, used = new Set();
  G.before = { rel: { ...W.rel }, equip: W.equip };
  G.ui.cover = { tight: 0.6, normal: 1.0, ample: 1.6 }[W.policy] ?? 1;

  const put = (card) => {
    if (!card) return false;
    const t = card.topic || 'etc';
    if (used.has(t)) return false;
    used.add(t);
    if (card.id) G.seen[card.id] = s.turn;
    if (card.id === 'cust') G.lastCust = s.turn;
    G.queue.push({ deck: t, card });
    return true;
  };

  // 1. 외부 충격 — 정해진 달에 온다
  const big = G.bigPlan && G.bigPlan[s.turn];
  if (big) put({ ...big, topic: 'big' });

  // 2. 회사가 만든 안건 — 반드시 올라올 것부터, 그다음 급한 순서
  const cand = worldIssues(s, W, G).sort((a, b) => (b.force - a.force) || (b.prio - a.prio));
  for (const c of cand) {
    if (G.queue.length >= 4) break;
    if (!c.force && G.queue.length >= 3 && c.prio < 70) break;
    put(c.card);
  }

  // 3. 사내 이야기 — 가끔. 숫자로 안 잡히는 일도 회사다.
  if (G.queue.length < 4 && wChance(0.28)) {
    const pool = DECK.life.filter(c => (!c.when || c.when(s, cardCtx(s))) && (s.turn - (G.seen[c.id] ?? -99)) > 12);
    if (pool.length) put(wPick(pool));
  }

  // 4. 너무 조용하면 기회를 하나 올린다
  if (G.queue.length < 2) put(custFocusCard(s, W));
  if (!G.queue.length) put(policyCard(s, W, coverOf(s)));
}

/* ---------- 결재 팝업: 카드 한 장씩, 고르면 바로 결과 ---------- */
function snap(s) {
  return { cash: s.cash, trust: s.trust, morale: s.morale, share: s.myShare };
}
function deltaChips(a, b) {
  const out = [];
  const push = (lab, d, f) => { if (Math.abs(d) > 1e-9) out.push(
    `<span class="chip ${d > 0 ? 'up' : 'down'}">${lab} ${d > 0 ? '+' : '−'}${f(Math.abs(d))}</span>`); };
  push('통장', b.cash - a.cash, v => money(v).replace('$', '$'));
  push('본사 신뢰', Math.round(b.trust - a.trust), v => v);
  push('직원 사기', Math.round(b.morale - a.morale), v => v);
  push('물량', (b.share / a.share - 1) * 100, v => v.toFixed(1) + '%');
  return out.join(' ');
}

/* 효과 칩 — 고르기 전에 뭘 얻고 뭘 잃는지 보인다.
   앞 글자로 색을 정한다. + 이득 / − 손해 / ? 도박 / = 중립 */
function fxChips(list) {
  if (!list || !list.length) return '';
  return `<div class="fx">${list.map(t => {
    const k = t[0];
    const cls = k === '+' ? 'up' : k === '−' || k === '-' ? 'dn' : k === '?' ? 'rsk' : 'neu';
    const body = '+−-?='.includes(k) ? t.slice(1) : t;
    const mark = k === '?' ? '⚠ ' : '';
    return `<span class="${cls}">${mark}${body}</span>`;
  }).join('')}</div>`;
}

/* 직원 얼굴 + 명패 + 말 */
function crewBlock(who) {
  const pic = who.img
    ? `<img src="${A(who.img + `.png`)}" alt="">`
    : `<div class="emoji">${who.face}</div>`;
  return `<div class="crew-pic">${pic}
    <div class="crew-plate"><b>${who.name}</b><i>${who.role}</i></div></div>`;
}

function openDecisions() {
  // 오늘 결재가 끝났으면 바로 한 달을 보낸다. 공장에 다시 들를 일이 없다.
  if (!G.queue || G.qi >= G.queue.length) { advance(); return; }

  const { deck, card } = G.queue[G.qi];
  const who = CAST[card.who] || CAST.han;
  const dlg = document.createElement('dialog');
  dlg.className = 'deck';

  const head = `<div class="deckhead">
    <span>${periodNow()} · ${DECK_LABEL[deck] || '결재'}</span>
    <span class="step">${G.qi + 1} / ${G.queue.length}</span></div>`;

  const ask = () => {
    dlg.innerHTML = `<div class="dlg">${head}
      <div class="crew">${crewBlock(who)}
        <div class="crew-body"><div class="line">${card.text}</div></div></div>
      <div class="deckq"><h2>${card.title}</h2></div>
      <div class="optlist">${card.opts.map((o, i) => `
        <button data-o="${i}"><b>${o.label}</b>${
          o.hint ? `<span class="why">${o.hint}</span>` : ''}${fxChips(o.fx)}</button>`).join('')}</div>
    </div>`;
    dlg.querySelectorAll('[data-o]').forEach(b => b.onclick = () => choose(+b.dataset.o));
  };

  const choose = (i) => {
    const o = card.opts[i];
    const before = snap(G.s);
    let msg = '';
    if (o.apply) msg = o.apply(G.s, G) || '';
    if (o.mult) G.mult *= o.mult;
    if (o.ot) G.ui.overtime = true;
    const chips = deltaChips(before, snap(G.s));
    G.done.push({ deck, title: card.title, choice: o.label, msg });
    if (msg) G.resultLines = (G.resultLines || []).concat(msg);

    const last = G.qi + 1 >= G.queue.length;
    const pic = who.img ? `<img src="${A(who.img + `.png`)}" alt="">`
                        : `<div class="em">${who.face}</div>`;
    dlg.innerHTML = `<div class="dlg">${head}
      <div class="verdict">
        <div class="vlabel">사장님의 결정</div>
        <div class="vchoice">${o.label}</div>
        ${msg ? `<div class="vwho">${pic}<span>${who.name}</span></div>
                 <p class="vmsg">${msg}</p>` : ''}
        ${chips ? `<div class="chips">${chips}</div>` : ''}
        ${o.mult && o.mult !== 1 ? `<div class="chips"><span class="chip ${o.mult >= 1 ? 'up' : 'down'}">
          이번 달 소재 발주 ×${o.mult}</span></div>` : ''}
      </div>
      <div class="vfoot"><button class="primary" id="nx">${
        last ? (G.mpt > 1 ? '석 달 보내기' : '한 달 보내기') : '다음 결재'}</button></div></div>`;
    dlg.querySelector('#nx').onclick = () => {
      dlg.close(); dlg.remove(); G.qi++; openDecisions();
    };
  };

  // ESC로 닫으면 결재 흐름이 끊긴다. 반드시 고르고 나가야 한다.
  dlg.addEventListener('cancel', e => e.preventDefault());
  document.body.appendChild(dlg);
  ask();
  dlg.showModal();
}

// 카드가 조건을 볼 때 쓰는 이번 달 상황
function cardCtx(s) {
  const c = capacityOf(s);
  const n = s.nasi[0] ? s.nasi[0].tons : {};
  const load = ((n.SLIT || 0) + (n.LEVEL || 0)) / Math.max(1, c.SLIT + c.LEVEL);
  const h = s.history;
  const pmTrend = h.length > 1 ? h[h.length - 1].pm - h[h.length - 2].pm : 0;
  return { load, tight: load > 0.97, idle: load < 0.55, pmTrend };
}

/* ---------- 파생값 ---------- */
function look(s) {
  const c = capacityOf(s);
  const now = s.nasi[0] ? s.nasi[0].tons : {};
  const avg = {}, pot = {};
  for (const k of PROC_LIST) {
    const xs = s.nasi.map(n => n.tons[k]), ps = s.nasi.map(n => (n.potential || n.tons)[k]);
    avg[k] = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
    pot[k] = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0;
  }
  const need = Math.min(c.SLIT, avg.SLIT) + Math.min(c.LEVEL, avg.LEVEL)
             + avg.C2C + Math.min(c.BLANK, (avg.TRAP || 0) + (avg.DIE || 0));
  const haveP = s.poOpen.concat(s.invRaw, s.invFg)
    .filter(l => (l.gr || 'COMMON') === 'PREMIUM').reduce((a, l) => a + l.qty, 0);
  const isBust = CFG.HQ_SPOT.phases.includes(s.market.phase);
  return { c, now, avg, pot, need, haveP, isBust,
    quota: isBust ? (c.SLIT + c.LEVEL + c.BLANK) * CFG.HQ_SPOT.capShareOfCap : 0,
    gapSlit: pot.SLIT - c.SLIT, gapLevel: pot.LEVEL - c.LEVEL };
}

// 고른 카드들이 이번 달 발주량에 거는 배수
function buildDecision(s, ui) {
  const L = look(s);
  const gap = L.need * (CFG.LEAD_TURNS + CFG.GRADE.PREMIUM.leadAdd + ui.cover) - L.haveP;
  const buy = Math.max(0, Math.min(gap, L.need * 1.6)) * (G ? (G.mult || 1) : 1);
  const n = L.now, hasCommon = (s.hqSpotCredit || 0) > 1;
  const idleS = Math.max(0, L.c.SLIT - (n.SLIT || 0)), idleL = Math.max(0, L.c.LEVEL - (n.LEVEL || 0));
  const runS = Math.min(L.c.SLIT, (n.SLIT || 0) + (hasCommon ? idleS : 0));
  const runL = Math.min(L.c.LEVEL, (n.LEVEL || 0) + (hasCommon ? idleL : 0));
  const runT = Math.min(L.c.BLANK * 0.5, n.TRAP || 0), runD = Math.min(L.c.BLANK * 0.5, n.DIE || 0);
  return {
    buy: { totalTon: buy, alpha: 1, beta: 1, hqSpotTon: ui.hqTake },
    invest: { addLine: ui.expandPick, newBuilding: s.lines.length >= CFG.MAX_LINES,
              yieldProgram: ui.yieldSpend, salesEffort: ui.salesSpend },
    options: { overtime: ui.overtime, // 깎아준 단가는 그 고객 비중만큼 매달 판가에 남는다
               discount: G ? (G.turnDiscount || 0) + (G.W ? standingCut(s, G.W) : 0) : 0,
               trimYield: G && G.trim ? G.trim.options[G.trimPick].yield : 0,
               custFocus: ui.custFocus || null },
    run: { SLIT: runS, LEVEL: runL, TRAP: runT, DIE: runD },
    // 팔 수 있는 만큼만 만든다. 더 만들면 그대로 창고에 눕는다.
    sell: { C2C: n.C2C || 0, SLIT: runS * CFG.YIELD.SLIT, LEVEL: runL * CFG.YIELD.LEVEL,
            TRAP: runT * CFG.YIELD.TRAP, DIE: runD * CFG.YIELD.DIE },
    _buyTon: buy, _L: L,
  };
}

/* 그림 주소. build 때 assets.js가 있으면 index.html 안에 data URI로 박히고,

const ART = 'art/';

function pl(file, x, y, w, z, title) {

/* 공장동 — 건물이 칸을 꽉 채운다. 증축하면 같은 동이 하나 더 선다. */
function hallView(s) {
  const n = s.buildings || 1;
  const halls = [];
  for (let i = 0; i < n; i++) halls.push(`<div class="hall">
      <img class="hallimg" src="${A('bldg1.png')}" alt="공장동">
      <img class="hallcrane" src="${A('crane.png')}" alt="">

    <div class="hallfoot">공장동 ${n}동 · 라인 ${s.lines.length} / ${CFG.MAX_LINES}${
      (s.buildQueue || []).length ? ` · 설치 중 ${(s.buildQueue || []).length}건` : ''}</div>`;
}

/* 설비 — 위에서 아래로. 기계가 주인공이고, 가동률은 그 밑에 한 줄로만 붙는다. */
function lineList(s, L) {
  const c = L.c;
  const rows = s.lines.map(l => {
    const used = l.type === 'SLIT'  ? (L.now.SLIT  || 0)
               : l.type === 'LEVEL' ? (L.now.LEVEL || 0)
               : (L.now.TRAP || 0) + (L.now.DIE || 0);
    const room = (l.type === 'SLIT' ? c.SLIT : l.type === 'LEVEL' ? c.LEVEL : c.BLANK)
               || CFG.LINE[l.type].cap;
    const util = Math.max(0, Math.min(1, used / Math.max(1, room)));
    const on = used > 0, pct = Math.round(util * 100);
    const file = { SLIT: 'slit', LEVEL: 'level', BLANK: 'blank' }[l.type] + (on ? '_on' : '_off') + '.png';
    return `<div class="lrow ${on ? '' : 'idle'}">
      <div class="ltop"><b>${CFG.LINE[l.type].label}</b>
        <i class="${on ? (util > .92 ? 'hot' : 'on') : 'off'}">${on ? `주문 부하 ${pct}%` : '주문 없음'}</i></div>
      <img src="${A(file)}" alt="">
      <div class="lbot">
        <span class="track"><span class="fill ${util > .92 ? 'over' : ''}" style="width:${pct}%"></span></span>
        <span class="sub">${fmt(used)} / ${fmt(room)}톤</span></div></div>`;
  });

  (s.buildQueue || []).forEach(b => rows.push(`<div class="lrow slim">
    <div class="ltop"><b>${CFG.LINE[b.type].label}</b><i class="wip">설치 중</i></div>
    <div class="ph">${dateLabel(b.readyTurn)}부터 가동 · 그때까지는 돈만 나갑니다</div></div>`));

  const left = CFG.MAX_LINES - s.lines.length - (s.buildQueue || []).length;
  for (let i = 0; i < left; i++) rows.push(`<div class="lrow slim">
    <div class="ltop"><b>빈 자리</b><i class="off">—</i></div>
    <div class="ph">증설하면 여기 들어갑니다</div></div>`);

  return `<div class="lines">${rows.join('')}</div>`;
}

/* 야드 현황 — 재고가 그림 한 장으로 보인다 */
function yardRack(s) {
  const raw = s.invRaw.reduce((a, l) => a + l.qty, 0);
  const fg = s.invFg.reduce((a, l) => a + l.qty, 0);
  const cap = CFG.WAREHOUSE_CAP_BASE;
  const over = (raw + fg) > cap;
  const age = inventoryAging(s);
  const oldTon = age[2].qty + age[3].qty;
  const afloat = s.poOpen.reduce((a, p) => a + p.qty, 0);
  const nextEta = s.poOpen.length ? Math.min(...s.poOpen.map(p => p.etaTurn)) : null;
  const fgSlit = s.invFg.filter(l => l.proc !== 'TRAP' && l.proc !== 'DIE').reduce((a, l) => a + l.qty, 0);
  const fgBlank = s.invFg.filter(l => l.proc === 'TRAP' || l.proc === 'DIE').reduce((a, l) => a + l.qty, 0);

  const tier = raw <= 0 ? null
             : raw < cap * 0.25 ? 'coil_s'
             : raw < cap * 0.55 ? 'coil_m'
             : raw < cap        ? 'coil_l'
             :                    'coil_over';

  const cell = (img, label, val, cls, sub) => `<div class="cell ${cls || ''}">
    ${img ? `<img src="${A(img + '.png')}" alt="">` : `<div class="ph">없음</div>`}
    <b>${label}</b><i class="${cls === 'bad' ? 'off bad' : 'on'}">${val}</i>
    ${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;

  const cells = [
    cell(tier, '소재 야드', `${fmt(raw)}t`, over ? 'bad' : '',
      over ? '한도 초과 · 동선이 막혔습니다' : `창고 한도의 ${Math.round(raw / cap * 100)}%`),
    cell(afloat > 0 ? 'ship' : null, '미착 (바다 위)', afloat > 0 ? `${fmt(afloat)}t` : '없음', '',
      afloat > 0 ? `${dateLabel(nextEta)} 첫 배 도착` : '들어올 배가 없습니다'),
    cell(fgSlit > 0 ? 'fg_slit' : null, '가공 제품', `${fmt(fgSlit)}t`, '', '슬리팅 · 레벨링 · 통코일'),
    cell(fgBlank > 0 ? 'fg_blank' : null, '블랭크', `${fmt(fgBlank)}t`, '', '프레스 가공품'),
    cell(oldTon > 0 ? 'coil_tarp' : null, '장기재고', oldTon > 0 ? `${fmt(oldTon)}t` : '없음',
      oldTon > 0 ? 'bad' : '', '3개월 넘은 것'),
    cell('scrap', '스크랩', '상시', '', '수율에서 나오는 것'),
  ];

  return `<div class="card">
    <h2>야드 · 재고</h2>
    <div class="rack">${cells.join('')}</div></div>`;
}

function plantView(s, L) {

  };
  const relNow = a.rel, relPrev = b.rel;
  const pace = a.hqPace;
  return `<div class="card">

    <div class="dash">
      ${tile('판매량', `${fmt(a.sales)}t`, a.sales - b.sales, false, v => fmt(v) + 't')}
      ${tile('영업이익', `${(a.op < 0 ? '−$' : '$') + fmt(Math.abs(a.op) / 1000)}k`, a.op - b.op, false, v => '$' + fmt(v / 1000) + 'k')}
      ${tile('현금', M(a.cash), a.cash - b.cash, false, v => '$' + (v / 1e6).toFixed(1) + 'M')}
      ${tile('소재 재고', `${fmt(a.raw)}t`, a.raw - b.raw, true, v => fmt(v) + 't')}
      ${tile('가동률', `${Math.round(a.util * 100)}%`, (a.util - b.util) * 100, false, v => v.toFixed(0) + '%p')}
      ${tile('양품률', `${a.quality.toFixed(1)}%`, a.quality - b.quality, false, v => v.toFixed(1) + '%p')}
      ${tile('설비', equipLabel(a.equip), a.equip - b.equip, false, () => '')}
      ${tile('고객 관계', relLabel(relNow), relNow - relPrev, false, () => '')}
      ${tile('본사 신뢰', Math.round(a.trust), a.trust - b.trust, false, v => v.toFixed(0))}
      ${tile('직원 사기', Math.round(a.morale), a.morale - b.morale, false, v => v.toFixed(0))}
      ${pace != null ? tile('본사 목표 페이스', `${Math.round(pace * 100)}%`, null, false, () => '') : ''}
      ${tile('현장', fatigueLabel(W.fatigue), null, false, () => '')}
    </div></div>`;
}

/* 지난달 결정의 영향 — 선택과 결과를 한 줄로 잇는다 */
function impactPanel(W) {
  if (!W.lastImpacts.length) return '';
  return `<div class="card">
    <h2>지난 결재의 영향</h2>
    <div class="imps">${W.lastImpacts.map(im => `<div class="imp"><b>${im.label}</b>
      <div class="fx">${im.rows.map(([k, t]) => {
        const cls = k === '+' ? 'up' : k === '−' ? 'dn' : k === '?' ? 'rsk' : 'neu';
        return `<span class="${cls}">${k === '?' ? '⚠ ' : ''}${t}</span>`; }).join('')}</div></div>`).join('')}</div>
    <p class="hint">판매량·이익 변화는 그 결정이 움직인 몫을 따로 떼어 추정한 값입니다.</p>
  </div>`;
}

/* 이번 달 여파 — 과거의 결정이 지금 돌아온 것 */
function firedPanel(W) {
  if (!W.lastFired.length) return '';
  return `<div class="card fired">
    <h2>돌아온 청구서</h2>
    ${W.lastFired.map(f => `<div class="fire">
      <b>${f.text}</b>${f.why ? `<span>원인 · ${f.why}</span>` : ''}</div>`).join('')}
  </div>`;
}

/* 조기 경보 */
function warnPanel(s, W) {
  const w = warnings(s, W);
  if (!w.length) return '';
  return `<div class="card warns">
    <h2>경고</h2>
    ${w.map(([k, t]) => `<div class="warn"><i>⚠ ${k}</i><span>${t}</span></div>`).join('')}
  </div>`;
}

/* 부서 보고 — 정보에는 확인·추정·소문이 섞여 있다 */
function briefPanel(s, W) {
  const b = briefing(s, W);
  return `<div class="card">
    <h2>부서 보고</h2>
    <div class="briefs">${b.map(x => {
      const who = CAST[x.who];
      return `<div class="brief">
        <div class="bface">${face(x.who)}</div>
        <div class="btext"><span class="bwho">${who.name} · ${who.role}
          <em class="k-${x.kind === '확인' ? 'ok' : x.kind === '추정' ? 'est' : 'rum'}">${x.kind}</em></span>
          ${x.text}</div></div>`; }).join('')}</div>
    <p class="hint">소문은 틀릴 수 있습니다. 누가 말했는지, 확인된 건지를 보고 판단하십시오.</p>
  </div>`;
}

/* 연차 배너 */
function yearBanner(s) {
  const y = Math.min(3, Math.floor((s.turn - 1) / 12));
  const t = YEAR_THEME[y];
  return `<div class="card yearban">
    <b>${y + 1}년차 · ${t.name}</b>
    <span>${t.text}</span>
    <span class="chap">${chapterOf(s, s.turn).label} — ${chapterOf(s, s.turn).brief}</span>
    ${(s.buildQueue || []).length ? `<div class="note">${(s.buildQueue || []).map(b =>
      `${CFG.LINE[b.type].label} 설치 중 — ${dateLabel(b.readyTurn)}부터 가동`).join(' · ')}</div>` : ''}
  </div>`;
}

/* ============================================================
   공장 화면 — 브리핑만 한다. 여기서는 아무것도 결정하지 않는다.
   상황을 보고, 준비가 되면 직원들을 부른다.
   ============================================================ */
function renderPlay() {
  const s = G.s, ui = G.ui;
  const d = buildDecision(s, ui), L = d._L;
  const ph = CFG.PHASE[s.market.phase];
  const stock = inventoryTons(s), transit = s.poOpen.reduce((a, p) => a + p.qty, 0);
  const coverNow = L.need > 0 ? (stock + transit) / L.need : 0;
  const canBorrow = s.debt.limit - s.debt.principal;
  const last = s.history[s.history.length - 1];

  app.innerHTML = `
    <div class="hud">
      <div class="stat"><div class="k">${s.companyName}</div>
        <div class="v" style="font-size:16px">${periodNow()}
          <span class="muted" style="font-size:12px">${periodIndex()}/${periodTotal()}</span></div></div>
      <div class="stat"><div class="k">시황</div><div class="v" style="font-size:16px">
        <span class="phase ph-${s.market.phase}">${ph.label}</span></div></div>
      <div class="stat"><div class="k">소재 시세</div><div class="v">$${fmt(s.market.pm)}</div></div>
      <div class="stat"><div class="k">통장</div><div class="v ${s.cash < 3e6 ? 'neg' : ''}">${M(s.cash)}</div></div>
      <div class="stat"><div class="k">은행 빚</div>
        <div class="v ${s.debt.principal > s.debt.limit * .8 ? 'neg' : ''}">${M(s.debt.principal)}</div></div>
      <div class="stat"><div class="k">본사 이익 누계</div>
        <div class="v ${s.hq.cumConsolidated < 0 ? 'neg' : 'pos'}">${M(s.hq.cumConsolidated)}</div></div>
      <div class="stat"><div class="k">직원 사기</div><div class="v">${Math.round(s.morale)}</div></div>
    </div>

    ${yearBanner(s)}

    ${firedPanel(G.W)}

    ${dashPanel(s, G.W)}

    <div class="grid g2">${impactPanel(G.W) || ''}${warnPanel(s, G.W) || ''}</div>

    ${briefPanel(s, G.W)}

    <div class="center" style="margin:6px 0 26px">
      <button class="primary" id="go">결재 시작</button>
      <p class="hint" style="margin-top:10px">${periodNow()} 안건이 올라와 있습니다.
        보고를 읽고, 무엇이 급한지 판단하십시오.</p>
    </div>

    ${plantView(s, L)}

    ${metricsPanel(s)}

    ${custPanel(s)}

    <div class="grid g2">
      <div class="card">
        <h2>이번 달 본사 주문</h2>
        ${bars(L.now, L.c)}
        <table style="margin-top:14px"><tr><th>받아둔 주문</th>${s.nasi.map(x => `<th>${x.turn}월</th>`).join('')}</tr>
          <tr><td>슬리팅</td>${s.nasi.map(x => `<td>${fmt(x.tons.SLIT)}</td>`).join('')}</tr>
          <tr><td>레벨링</td>${s.nasi.map(x => `<td>${fmt(x.tons.LEVEL)}</td>`).join('')}</tr>
          <tr><td>통코일</td>${s.nasi.map(x => `<td>${fmt(x.tons.C2C)}</td>`).join('')}</tr></table>
        <p class="hint">자동차강판은 석 달 앞까지 물량이 확정됩니다(내시). 이걸 보고 소재를 시킵니다.</p>
        ${last ? `<div class="note ${last.shortageEvents.length ? 'bad' : 'good'}">지난달 주문
          ${fmt(Object.values(last.demandAuto).reduce((a, b) => a + b, 0))}톤 중
          <b>${fmt(Object.values(last.shipped).reduce((a, b) => a + b, 0))}톤 납품</b>
          ${last.shortageEvents.length ? '· 못 채운 고객이 있습니다' : '· 다 채웠습니다'}</div>` : ''}
      </div>

      <div class="card">
        <h2>돈이 어디 있나</h2>
        <table>
          <tr><td>통장</td><td>${money(s.cash)}</td></tr>
          <tr><td>받을 돈</td><td>${money(s.ar.reduce((a, x) => a + x.amount, 0))}</td></tr>
          <tr><td>창고에 잠긴 돈</td><td>${money(stock * s.market.pm)}</td></tr>
          <tr><td>바다에 잠긴 돈</td><td>${money(s.poOpen.reduce((a, p) => a + p.qty * p.unitPriceFixed, 0))}</td></tr>
          <tr><td>줄 돈 (소재값)</td><td class="v neg">−${fmt(s.ap.reduce((a, x) => a + x.amount, 0))}</td></tr>
          <tr><td>은행 빚</td><td class="v neg">−${fmt(s.debt.principal)}</td></tr>
          <tr class="tot"><td>더 빌릴 수 있는 돈</td><td>${money(canBorrow)}</td></tr></table>
        <p class="hint">통장에 돈이 있어도 안심하면 안 됩니다. 대부분 아직 안 낸 소재값입니다.</p>
        <div class="sep"></div>
        <h2>재고가 얼마나 오래됐나</h2>
        ${agingPanel(s)}
        <div class="sep"></div>
        <table><tr><td>창고 + 바다</td><td>${fmt(stock + transit)} 톤</td></tr>
          <tr class="tot"><td>몇 달치인가</td>
            <td class="${coverNow < 2.5 ? 'v neg' : ''}">${coverNow.toFixed(1)}개월</td></tr></table>
        ${coverNow < 2.5 && s.turn > 5 ? `<div class="note bad">${CAST.jung.name}: 이대로면 다음 달 어느 고객 하나는 못 채웁니다.</div>` : ''}
      </div>
    </div>

    ${decisionsMade()}`;

  $('#go').onclick = () => { dealTurn(); openDecisions(); };
}

/* 재고 나이 — 같은 18,000톤이라도 전부 한 달짜리인 것과
   절반이 열 달짜리인 것은 완전히 다른 회사다. */
function agingPanel(s) {
  const b = inventoryAging(s);
  const tot = b.reduce((a, x) => a + x.qty, 0);
  if (tot < 1) return `<p class="hint">창고가 비어 있습니다.</p>`;
  const old = b[2].qty + b[3].qty;
  return `<div class="bars">${b.map((x, i) => `
    <div class="bar"><span>${x.label}</span>
      <span class="track"><span class="fill ${i >= 2 ? 'over' : ''}"
        style="width:${x.qty / tot * 100}%"></span></span>
      <span class="n">${fmt(x.qty)}t</span></div>`).join('')}</div>
    ${old > tot * 0.25
      ? `<div class="note bad">${CAST.oh.name}: 석 달 넘은 게 ${fmt(old)}톤입니다.
         여섯 달 넘으면 녹이 슬어 값을 못 받습니다.</div>`
      : `<p class="hint">석 달까지는 멀쩡합니다. 그 뒤부터 값이 떨어집니다.</p>`}`;
}

/* 이번 달 슬리팅 배분 — 코일센터에서만 나오는 결정 */
/* ============================================================
   운영 결정도 사람이 들고 들어온다.
   화면에 슬라이더로 박아두지 않고, 그 달에 필요할 때만 카드로 올린다.
   ============================================================ */

/* 슬리팅 배분 — 원코일을 어떻게 쪼갤 것인가 */
function trimCard() {
  const t = G.trim, base = CFG.YIELD.SLIT;
  return {
    id: 'op-trim', who: 'gu', topic: 'op',
    title: '원코일을 어떻게 쪼갤까요',
    text: `원코일 폭 ${COIL_WIDTH}mm입니다. 이번 달 고객이 달라는 폭은 `
        + `${t.widths.map(w => w + 'mm').join(', ')} 이렇게 셋입니다. `
        + `남는 폭은 그대로 버립니다. 고객하고는 수율 ${(base * 100).toFixed(0)}%로 값을 정해놨으니까, `
        + `그보다 잘 자르면 그 차액은 우리 겁니다.`,
    opts: t.options.map((o, i) => {
      const diff = (o.yield - base) * 100;
      const combo = t.widths.map((w, k) => o.cuts[k] ? `${w}×${o.cuts[k]}` : null).filter(Boolean).join(' + ');
      return {
        label: combo,
        hint: `수율 ${(o.yield * 100).toFixed(1)}% · 버리는 폭 ${o.trim}mm`,
        fx: [`${diff >= 0 ? '+' : '−'}약속 대비 ${Math.abs(diff).toFixed(1)}%p`,
             diff >= 0 ? '+차액은 우리 이익' : '−차액은 우리가 문다'],
        apply: (s, g) => { g.trimPick = i;
          return diff >= 0
            ? `${combo}로 잡았습니다. 약속한 ${(base * 100).toFixed(0)}%보다 잘 나옵니다. 그만큼 우리 이익입니다.`
            : `${combo}로 잡았습니다. 약속한 수율에 못 미칩니다. 차액은 우리가 뭅니다.`; },
      };
    }),
  };
}

/* 불황기 본사 지시 — 유통향 일반재를 얼마나 받을 것인가 */
function hqCard(L, s) {
  const q = Math.round(L.quota);
  const step = Math.max(500, Math.round(q / 4 / 500) * 500);
  const mk = (ton, label, hint, fx) => ({
    label, hint, fx,
    apply: (st, g) => { g.ui.hqTake = ton;
      if (ton === 0) { st.trust -= CFG.HQ_SPOT.refuseTrustCost;
        return '본사 지시를 거절했습니다. 본사 영업팀이 서운해합니다. 이런 건 평가 때 기억납니다.'; }
      return `${fmt(ton)}톤을 받기로 했습니다. 이제 이걸 우리가 알아서 팔아야 합니다. `
           + `못 팔면 창고에서 늙다가 반값에 나갑니다.`; },
  });
  return {
    id: 'op-hq', who: 'jung', topic: 'op',
    title: '본사 지시 물량을 얼마나 받을까요',
    text: `사장님, 본사 공장이 물량을 못 채웠답니다. 유통향 일반재를 시세보다 `
        + `${(CFG.HQ_SPOT.discount * 100).toFixed(0)}% 싸게 넘기겠다고요. 싼 건 맞습니다. `
        + `근데 이건 고객이 정해진 물건이 아니에요. 우리가 알아서 팔아야 합니다. `
        + `그리고 유통향은 본사 정책상 전체 판매의 15%까지밖에 못 팝니다.`,
    opts: [
      mk(q, '배정량 전부 받는다', `${fmt(q)}톤`,
        ['+본사 신뢰 ↑↑', '−현금이 크게 묶임', '?15% 넘는 건 안 팔린다']),
      mk(Math.round(q * 0.5), '절반만 받는다', `${fmt(Math.round(q * 0.5))}톤`,
        ['+본사 체면 세움', '=팔 수 있는 만큼']),
      mk(step, '생색만 낸다', `${fmt(step)}톤`,
        ['+위험 최소', '−본사가 아쉬워한다']),
      mk(0, '받지 않는다', '우리 살림부터',
        ['+현금 지킴', `−본사 신뢰 ${CFG.HQ_SPOT.refuseTrustCost}`]),
    ],
  };
}

/* 증설 — 설비값보다 소재값이 훨씬 크다는 게 이 카드의 교훈 */
function expandCard(type, L, s) {
  const capex = CFG.LINE[type].capex;
  const newBuild = s.lines.length >= CFG.MAX_LINES;
  const total = capex + (newBuild ? CFG.INFRA_TOTAL : 0);
  const feed = CFG.LINE[type].cap * 3 * s.market.pm;
  const why = type === 'BLANK'
    ? '블랭킹은 지금 우리한테 없는 시장입니다. 놓으면 고객이 새로 붙습니다.'
    : `본사가 주고 싶어 하는 물량이 우리 한계를 월 ${fmt(Math.round(type === 'SLIT' ? L.gapSlit : L.gapLevel))}톤 넘습니다.`;
  return {
    id: 'op-expand', who: 'gu', topic: 'op',
    title: `${CFG.LINE[type].label}를 한 대 더 놓을까요`,
    text: `${why} ${newBuild ? '근데 자리가 없습니다. 공장동을 한 동 더 지어야 합니다. ' : '자리는 있습니다. '}`
        + `말씀드릴 게 하나 있는데, 설비값보다 그걸 채울 소재값이 훨씬 큽니다. 석 달치만 해도 ${money(feed)}입니다.`,
    opts: [
      { label: '짓겠습니다', hint: `${CFG.INSTALL_TURNS}개월 뒤 가동`,
        fx: [`−설비 ${money(total)}`, `−소재 ${money(feed)} 추가로 묶임`,
             `+${CFG.INSTALL_TURNS}개월 뒤 캐파 ↑`],
        apply: (st, g) => { g.ui.expandPick = type;
          return `${CFG.LINE[type].label} 발주했습니다. ${CFG.INSTALL_TURNS}개월 뒤부터 돕니다. `
               + `그때까지는 돈만 나갑니다.`; } },
      { label: '이번엔 넘어갑니다', hint: '현금을 지킨다',
        fx: ['+현금 지킴', '−이 물량은 못 받는다'],
        apply: () => '증설은 미뤘습니다. 그 물량은 다른 데로 갑니다.' },
    ],
  };
}

/* ---------- 경영지표: 당월 / 누계 / 전월 대비 ---------- */
function metricsPanel(s) {
  const h = s.history;
  // 속성 모드는 석 달을 한 칸으로 묶어 보여준다
  const n = (G && G.mpt) || 1;
  const seg = end => { const a = h.slice(Math.max(0, end - n), end); return a.length ? mergeReports(a) : null; };
  const R = seg(h.length), P = seg(h.length - n);
  const CUR = n > 1 ? '이번 분기' : '당월', PRV = n > 1 ? '전분기 대비' : '전월 대비';
  if (!R) return `<div class="card metrics"><h2>경영지표</h2>
    <p class="hint">${periodNow()} 결산이 끝나면 여기에 실적이 쌓입니다.</p></div>`;
  const t = v => fmt(v) + 't';
  // 돈은 전부 천달러(k$)로 통일한다. 단위가 섞이면 비교가 안 된다.
  const K = v => (v < 0 ? '−$' : '$') + fmt(Math.abs(v) / 1000) + 'k';
  // inv: 늘어나면 나쁜 지표 (장기재고·지연채권·차입금)
  const row = (label, cur, cum, prev, f, cls = '', inv = false) => {
    const d = prev == null ? null : cur - prev;
    const dc = d == null || Math.abs(d) < 1e-6 ? '' : (d > 0 ? 'up' : 'dn') + (inv ? ' inv' : '');
    return `<tr class="${cls}"><td>${label}</td><td>${f(cur)}</td>
      <td>${cum == null ? '' : f(cum)}</td>
      <td class="${dc}">${d == null ? '—' : Math.abs(d) < 1e-6 ? '–' : (d > 0 ? '▲ ' : '▼ ') + f(Math.abs(d))}</td></tr>`;
  };
  const tot = x => x.C2C + x.SLIT + x.LEVEL + x.BLANK;
  const sp = P ? P.sales : null, bp = P ? P.bs : null;
  return `<div class="card metrics">
    <h2>경영지표 · ${n > 1 ? periodLabel(R.firstTurn || R.turn, 3) : R.date}</h2>
    <table>
      <tr><th>금액 단위 : 천달러 (k$)</th><th>${CUR}</th><th>누계</th><th>${PRV}</th></tr>

      ${row('통코일', R.sales.C2C, R.cum.sales.C2C, sp && sp.C2C, t, 'sub')}

      ${row('가공 · 블랭킹', R.sales.BLANK, R.cum.sales.BLANK, sp && sp.BLANK, t, 'sub')}

      ${row('영업이익', R.op, R.cum.op, P && P.op, K, 'tot')}
      ${row('순이익', R.np, R.cum.np, P && P.np, K)}
      <tr class="head"><th colspan="4">월말 잔액</th></tr>

      ${row('장기재고 (3개월 초과)', R.bs.longTons, null, bp && bp.longTons, t, '', true)}
      ${row('매출채권', R.bs.ar, null, bp && bp.ar, K)}
      ${row('지연채권', R.bs.arDelayed, null, bp && bp.arDelayed, K, '', true)}
      ${row('차입금', R.bs.debt, null, bp && bp.debt, K, '', true)}
      ${row('순운전자본', R.bs.nwc, null, bp && bp.nwc, K, 'tot')}
