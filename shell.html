<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코일센터의 제왕 — 로드 오브 코일센터</title>
<meta name="description" content="해외 코일센터 사장으로 4년을 경영하는 시뮬레이션. 주재원·수출영업 교육용.">

<!-- 휴대폰에 앱으로 깔린다. manifest와 sw.js는 index.html 옆에 같이 올라간다.
     파일 하나만 받아서 더블클릭해도 게임은 그대로 돈다 — 그때는 설치 기능만 안 뜬다. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5f8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="코일센터의 제왕">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- 본문은 Pretendard, 숫자와 제목은 픽셀 폰트 Galmuri.
     인터넷이 없으면 아래 fallback으로 내려간다. 게임은 그대로 돈다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  /* ============================================================
     스틸그레이드 팔레트 + 큐비즘
     둥근 것을 걷어내고, 각진 면과 단단한 그림자로 화면을 나눈다.
     ============================================================ */
  :root{
    --bg:#dbe4ed; --panel:#f9fbfd; --panel2:#e7eef6;
    --ink:#14283c; --dim:#5d7385; --line:#b4c5d5; --shade:#c1d0de;
    --blue:#1e5f8c; --blue-l:#dbeaf5;
    --teal:#2b7a6b; --teal-l:#d9efe8;
    --ochre:#d99a2b; --ochre-l:#f9edd2;
    --rust:#c0522a; --rust-l:#f9ded3;
    --good:#2b7a6b; --warn:#c0522a;
    --cut:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.62 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:linear-gradient(135deg,rgba(255,255,255,.45) 0 25%,transparent 25% 50%,
      rgba(255,255,255,.45) 50% 75%,transparent 75%);
    background-size:72px 72px}
  .wrap{max-width:1060px;margin:0 auto;padding:22px 18px 80px}

  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.035em;font-weight:800;line-height:1.2}
  h2{font-size:19px;margin:0 0 12px;letter-spacing:-.025em;font-weight:800}
  .sub{color:var(--dim);font-size:15px;margin:0 0 22px;max-width:62ch}

  /* ---------- 면(面) ---------- */
  .card{background:var(--panel);border:2px solid var(--ink);
    padding:18px 18px 16px;margin-bottom:16px;position:relative;
    box-shadow:6px 6px 0 var(--shade);
    clip-path:polygon(0 var(--cut),var(--cut) 0,100% 0,100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,0 100%)}
  .grid{display:grid;gap:16px}
  @media(min-width:860px){ .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} }

  /* ---------- 상단 계기판 ---------- */
  .hud{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .stat{background:var(--panel);border:2px solid var(--ink);padding:9px 13px;
    min-width:118px;flex:1 1 auto;box-shadow:4px 4px 0 var(--shade);
    clip-path:polygon(0 9px,9px 0,100% 0,100% 100%,0 100%)}
  .stat .k{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.02em}
  .stat .v{font-size:21px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    line-height:1.25}
  .v.neg{color:var(--rust)} .v.pos{color:var(--teal)}

  .phase{display:inline-block;padding:2px 11px;font-size:14px;font-weight:800;
    border:2px solid var(--ink);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
  .ph-BUST{background:var(--rust-l);color:var(--rust)}
  .ph-NORMAL{background:var(--panel2);color:var(--dim)}
  .ph-BOOM{background:var(--teal-l);color:var(--teal)}

  /* ---------- 사람이 말한다 ---------- */
  .say{display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}
  .face{width:60px;height:60px;flex:0 0 60px;overflow:hidden;
    border:2px solid var(--ink);background:var(--panel2);
    display:grid;place-items:center;font-size:27px;
    clip-path:polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
  .facepic{width:100%;height:100%;object-fit:cover;display:block}
  .bubble{background:var(--panel2);border:2px solid var(--ink);padding:10px 15px;
    font-size:16.5px;max-width:64ch;box-shadow:4px 4px 0 var(--shade);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
  .bubble .who{font-size:12.5px;color:var(--dim);display:block;margin-bottom:2px;font-weight:800;
    letter-spacing:.02em}

  /* 첫 화면 크레딧 */
  .byline{text-align:center;margin:-8px 0 2px;font-size:14px;color:var(--dim);letter-spacing:-.01em}
  .byline b{color:var(--blue)}
  .thanks{text-align:center;margin:0 0 16px;font-size:12px;color:var(--dim);
    letter-spacing:.02em;opacity:.85}

  /* 이어하기 · 설치 안내 · 명예의 전당 */
  .records{border-color:var(--ink)}
  .resume{border-color:var(--blue);box-shadow:5px 5px 0 var(--blue-l)}
  .install .steps{margin:6px 0 2px;padding-left:20px;font-size:14px;line-height:1.8}
  .install .steps b{color:var(--blue)}
  .iways{display:grid;gap:12px;margin-top:12px}
  @media(min-width:760px){ .iways{grid-template-columns:1fr 1fr} }
  .iway{border:2px solid var(--line);background:var(--panel2);padding:12px 14px 13px}
  .iway.on{border-color:var(--blue);background:var(--blue-l)}
  .iway h3{margin:0 0 6px;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .iway p{margin:4px 0 9px;font-size:14px}
  .iway button.primary{width:100%}
  .hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .rectbl{overflow-x:auto;margin-top:8px}
  .rectbl table{width:100%;border-collapse:collapse;font-size:13px}
  .rectbl th{background:var(--blue);color:#fff;padding:6px 7px;font-size:11.5px;font-weight:800;
    border:1px solid var(--ink);white-space:nowrap}
  .rectbl td{padding:6px 7px;border:1px solid var(--line);white-space:nowrap;
    font-variant-numeric:tabular-nums;text-align:right}
  .rectbl td.hname,.rectbl td.hstyle{text-align:left;font-weight:700}
  .rectbl td.hgrade{font-weight:900;color:var(--blue);text-align:center}
  .rectbl td.dn{color:var(--rust);font-weight:800}
  .savebtn{margin-left:auto}

  /* 저장 알림 */
  #toast{position:fixed;left:50%;bottom:-70px;transform:translateX(-50%);z-index:99;
    background:var(--ink);color:#fff;padding:11px 18px;font-size:14px;font-weight:700;
    border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shade);max-width:90vw;
    transition:bottom .22s ease;pointer-events:none}
  #toast.on{bottom:22px}

  /* 고객군별 소재 발주 — 숫자를 직접 적는 화면 */
  .ordwrap{padding:14px 16px 16px}
  .ordt{width:100%;border-collapse:collapse;font-size:13px}
  .ordt th{background:var(--blue);color:#fff;padding:6px 5px;font-weight:800;font-size:11.5px;
    line-height:1.25;border:1px solid var(--ink);text-align:center}
  .ordt th i{font-style:normal;font-weight:600;opacity:.8;font-size:10.5px}
  .ordt td{padding:6px 5px;border:1px solid var(--line);text-align:right;
    font-variant-numeric:tabular-nums}
  .ordt td.oname{text-align:left;font-weight:800;white-space:nowrap}
  .ordt td.oname i{font-style:normal;font-weight:600;color:var(--dim);font-size:11px;display:block}
  .ordt td.dn{color:var(--rust);font-weight:800}
  .ordt td.oaf{font-weight:800;background:var(--blue-l)}
  .ordt input{width:84px;padding:5px 6px;border:2px solid var(--ink);background:var(--panel);
    color:var(--ink);font:inherit;font-weight:800;text-align:right;
    font-variant-numeric:tabular-nums}
  .ordbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    margin:12px 0 4px;padding:9px 11px;background:var(--panel2);border:2px solid var(--ink)}
  .osum{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:14px}
  .osum b{font-size:17px}
  .osum .up{color:var(--teal);font-weight:800}
  .osum .dn{color:var(--rust);font-weight:800}
  .obtns{display:flex;gap:6px;flex-wrap:wrap}
  button.mini{padding:5px 10px;font-size:12px;font-weight:800;border:2px solid var(--ink);
    background:var(--panel);color:var(--ink);cursor:pointer}
  button.mini:hover{background:var(--blue);color:#fff}
  @media(max-width:560px){
    .ordwrap{padding:10px 8px 12px}
    .ordt{font-size:11.5px}
    .ordt th{font-size:10px;padding:4px 2px}
    .ordt td{padding:4px 2px}
    .ordt input{width:62px;padding:4px}
  }

  /* 인과 고리 — 그때 그 결정 → 몇 달 뒤 → 지금 */
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:7px;font-size:13px}
  .c-then{background:var(--panel2);border:2px solid var(--ink);padding:3px 9px;font-weight:700}
  .c-then i{display:block;font-style:normal;font-size:11px;color:var(--dim);font-weight:800;
    letter-spacing:.02em}
  .c-arrow{color:var(--blue);font-weight:800;letter-spacing:-.01em}
  .c-now{background:var(--blue);color:#fff;padding:3px 9px;font-weight:800;border:2px solid var(--ink)}

  /* 사람이 실제로 하는 말에는 따옴표를 붙인다. 보고서가 아니라 대사로 읽히게. */
  .says::before{content:'“';color:var(--blue);font-weight:800;margin-right:1px}
  .says::after{content:'”';color:var(--blue);font-weight:800;margin-left:1px}
  .bubble.says::before,.bubble.says::after{font-size:1.1em;line-height:0}

  /* ---------- 조작 ---------- */
  label.row{display:block;margin:16px 0 0}
  .row .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;
    margin-bottom:6px;font-weight:700}
  .row .lab b{font-size:17px;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--blue);height:26px}
  .hint{font-size:14px;color:var(--dim);margin-top:5px}

  button{font:inherit;cursor:pointer;border:2px solid var(--ink);
    background:var(--panel);color:var(--ink);padding:10px 17px;transition:.1s;
    font-weight:700;box-shadow:3px 3px 0 var(--shade)}
  button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shade)}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shade)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shade)}
  .primary{background:var(--blue);border-color:var(--ink);color:#fff;font-weight:800;
    padding:15px 32px;font-size:19px;letter-spacing:-.02em;box-shadow:5px 5px 0 var(--ink)}
  .primary:hover{box-shadow:7px 7px 0 var(--ink)}
  .primary:active{box-shadow:2px 2px 0 var(--ink)}
  .choice{display:flex;gap:9px;flex-wrap:wrap}
  .choice button.on{background:var(--teal);border-color:var(--ink);color:#fff}

  table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:700;font-size:12.5px;letter-spacing:.02em}
  tr.tot td{font-weight:800;border-top:3px solid var(--ink);border-bottom:none}

  .bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .bar{display:grid;grid-template-columns:78px 1fr 86px;gap:10px;align-items:center;font-size:14px;
    font-weight:700}
  .track{height:20px;background:var(--panel2);border:2px solid var(--ink);overflow:hidden;
    position:relative}
  .fill{display:block;height:100%;background:var(--teal)}
  .fill.over{background:var(--rust)}
  .cap{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
  .bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}

  .note{background:var(--blue-l);border:2px solid var(--ink);padding:11px 15px;
    font-size:15px;margin:12px 0;box-shadow:3px 3px 0 var(--shade)}
  .note.bad{background:var(--rust-l)}
  .note.good{background:var(--teal-l)}

  dialog{border:none;padding:0;max-width:640px;width:calc(100% - 28px);
    background:transparent;color:var(--ink)}
  dialog::backdrop{background:rgba(30,38,43,.62)}
  .dlg{padding:20px;background:var(--panel);border:3px solid var(--ink);
    box-shadow:10px 10px 0 rgba(30,38,43,.32)}
  dialog.deck .dlg{padding:0}
  .ok{text-align:right;margin-top:18px}

  .big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
  .center{text-align:center}
  .muted{color:var(--dim)}
  .sep{height:2px;background:var(--ink);margin:16px 0;opacity:.18}
  .tag{display:inline-block;background:var(--panel2);border:2px solid var(--ink);
    padding:2px 10px;font-size:12.5px;color:var(--ink);margin-right:5px;font-weight:700;
    clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
</style>
<div class="wrap" id="app"></div>
<style>
  /* ---------- 픽셀 아트 공통 ---------- */
  .halls img, .lines img, .rack img, .facepic, .crew-pic img, .vwho img{
    image-rendering:pixelated; image-rendering:crisp-edges}
  /* ---------- 공장동: 칸을 꽉 채운다 ---------- */
  .halls{display:flex;flex-direction:column;gap:12px}
  .hall{position:relative;width:100%;background:var(--panel2);
    border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shade);overflow:hidden}
  .hallimg{display:block;width:100%;height:auto}
  .hallcrane{position:absolute;left:50%;top:20%;width:27%;transform:translateX(-50%);display:block}
  .halltag{position:absolute;left:0;top:0;background:var(--ink);color:var(--panel);
    padding:2px 11px;font-size:13px;font-weight:800}
  .hallfoot{font-size:13.5px;font-weight:700;color:var(--dim);text-align:center;margin-top:10px}

  /* ---------- 설비: 기계가 주인공, 가동률은 한 줄 ---------- */
  .lines{display:flex;flex-direction:column;gap:12px}
  .lrow{border:2px solid var(--ink);background:var(--panel2);padding:9px 11px 10px;
    box-shadow:4px 4px 0 var(--shade)}
  .lrow img{display:block;width:100%;height:auto;max-height:230px;object-fit:contain;
    margin:4px 0 6px}
  .ltop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .ltop b{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .ltop i{font-style:normal;font-size:13px;font-weight:800;padding:1px 10px;
    border:2px solid var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ltop i.on{background:var(--teal-l);color:var(--teal)}
  .ltop i.hot{background:var(--rust-l);color:var(--rust)}
  .ltop i.off{background:var(--panel);color:var(--dim)}
  .ltop i.wip{background:var(--ochre-l);color:#8a6410}
  .lbot{display:flex;align-items:center;gap:10px}
  .lbot .track{flex:1;height:8px;border-width:1.5px}
  .lbot .sub{font-size:12.5px;color:var(--dim);font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .lrow.idle img{filter:grayscale(.85) opacity(.55)}
  .lrow.slim{background:var(--panel)}
  .lrow.slim .ph{margin-top:7px;padding:14px 10px;text-align:center;
    border:2px dashed var(--line);color:var(--dim);font-size:13px;font-weight:600}


  /* ---------- 야드 진열 ---------- */
  .rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .cell{border:2px solid var(--ink);background:var(--panel2);padding:8px 8px 9px;text-align:center;
    box-shadow:3px 3px 0 var(--shade);display:flex;flex-direction:column;align-items:center;gap:2px}
  .cell img{width:100%;max-width:110px;height:auto;display:block;margin-bottom:2px}
  .cell .ph{width:100%;max-width:110px;aspect-ratio:1/1;display:grid;place-items:center;
    border:2px dashed var(--line);color:var(--dim);font-size:12.5px;font-weight:700;margin-bottom:2px}
  .cell b{font-size:14.5px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .cell i{font-style:normal;font-size:12.5px;font-weight:800;padding:1px 9px;
    border:1.5px solid var(--ink);font-variant-numeric:tabular-nums}
  .cell i.on{background:var(--teal-l);color:var(--teal)}
  .cell i.off{background:var(--panel);color:var(--dim)}
  .cell i.off.bad{background:var(--rust-l);color:var(--rust);border-color:var(--rust)}
  .cell .sub{font-size:11.5px;color:var(--dim);line-height:1.35;font-weight:600}
  .cell.bad{background:var(--rust-l);border-color:var(--rust)}
  @media(max-width:560px){
    .rack{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
    .cell b{font-size:13px} .cell .sub{font-size:11px}
    .lrow img{max-height:180px}
    .lrow b{font-size:14px}
  }
</style>

<style>
  /* ---------- 지표표 · 고객 ---------- */
  .metrics table td:nth-child(n+2),.metrics table th:nth-child(n+2){text-align:right}
  .metrics td.up{color:var(--teal);font-weight:800}
  .metrics td.dn{color:var(--rust);font-weight:800}
  .metrics td.up.inv{color:var(--rust)} .metrics td.dn.inv{color:var(--teal)}
  .metrics tr.sub td:first-child{padding-left:20px;color:var(--dim)}
  /* 카테고리 머리줄 — 판매 실적 / 손익 / 재고·재원 / 순운전자본 / 차입이 눈에 갈리게
     띠를 깔아준다. 줄이 스무 개 넘어가면 어디서 어디까지가 한 덩어리인지 안 보인다. */
  .metrics tr.head th{text-align:left;color:#fff;font-size:13px;font-weight:800;
    background:var(--blue);padding:7px 8px;letter-spacing:-.01em;
    border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
  .metrics tr.head th:nth-child(n+2){text-align:right;color:rgba(255,255,255,.75);font-weight:700}
  .metrics tr.head.c-sale th{background:var(--blue)}
  .metrics tr.head.c-pl   th{background:var(--teal)}
  .metrics tr.head.c-stock th{background:var(--ochre);color:var(--ink)}
  .metrics tr.head.c-stock th:nth-child(n+2){color:rgba(20,40,60,.7)}
  .metrics tr.head.c-wc   th{background:var(--rust)}
  .metrics tr.head.c-debt th{background:var(--ink)}
  .custbar{display:grid;grid-template-columns:168px 1fr 54px;gap:10px;align-items:center;
    font-size:15px;margin:7px 0;font-weight:700}
  .custbar .track{height:18px}
  .custbar .pend{font-size:12.5px;color:var(--rust);margin-left:5px;font-weight:800}
  @media(max-width:560px){ .custbar{grid-template-columns:118px 1fr 46px;font-size:13.5px} }

  /* ---------- 시작 화면 모드 ---------- */
  .modes{display:grid;gap:14px;margin-top:6px}
  @media(min-width:760px){ .modes{grid-template-columns:1fr 1fr} }
  .modecard{text-align:left;padding:18px 20px;line-height:1.55;
    border:2px solid var(--ink);background:var(--panel);box-shadow:5px 5px 0 var(--shade)}
  .modecard:hover{background:var(--blue-l)}
  .modecard b{display:block;font-size:24px;letter-spacing:-.03em;font-weight:800}
  .modecard .n{display:block;font-size:13.5px;color:var(--blue);font-weight:800;margin:3px 0 8px;
    letter-spacing:.02em}
  .modecard .d{display:block;font-size:14.5px;color:var(--dim)}
</style>

<style>
  /* ============================================================
     직원이 들어온다 — 결재 카드
     얼굴을 크게 깔고, 이름을 명패처럼 박고, 말은 말대로 크게.
     ============================================================ */
  .deckhead{display:flex;justify-content:space-between;align-items:center;
    background:var(--ink);color:var(--panel);padding:9px 18px;font-size:13px;font-weight:800;
    letter-spacing:.04em}
  .deckhead .step{opacity:.62;font-variant-numeric:tabular-nums}

  .crew{display:flex;align-items:stretch;border-bottom:3px solid var(--ink)}
  .crew-pic{width:132px;flex:0 0 132px;background:var(--panel2);position:relative;
    border-right:3px solid var(--ink);overflow:hidden}
  .crew-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .crew-pic .emoji{width:100%;height:100%;display:grid;place-items:center;font-size:54px}
  .crew-plate{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--panel);
    padding:5px 9px;line-height:1.25}
  .crew-plate b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .crew-plate i{font-style:normal;font-size:11.5px;opacity:.78;font-weight:600}
  .crew-body{flex:1;padding:16px 18px;min-width:0;display:flex;flex-direction:column;
    justify-content:center;background:var(--blue-l)}
  .crew-body .line{font-size:18px;line-height:1.58;font-weight:600;letter-spacing:-.015em}
  @media(max-width:560px){
    .crew-pic{width:96px;flex:0 0 96px}
    .crew-plate b{font-size:14px}
    .crew-body{padding:13px 14px}
    .crew-body .line{font-size:16px}
  }

  .deckq{padding:16px 18px 4px}
  .deckq h2{font-size:21px;margin:0;letter-spacing:-.03em;line-height:1.35}

  .optlist{display:flex;flex-direction:column;gap:10px;padding:12px 18px 18px}
  .optlist button{text-align:left;padding:14px 16px;line-height:1.5;width:100%;
    box-shadow:4px 4px 0 var(--shade)}
  .optlist button b{display:block;font-size:17.5px;font-weight:800;letter-spacing:-.02em}
  .optlist button .why{display:block;font-size:14.5px;color:var(--dim);margin-top:3px}
  .optlist button:hover{background:var(--blue-l);border-color:var(--blue)}

  /* 선택지에 붙는 효과 칩 — 고르기 전에 뭘 얻고 잃는지 보인다 */
  .fx{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .fx span{font-size:12.5px;font-weight:800;padding:1px 8px;border:1.5px solid var(--ink);
    font-variant-numeric:tabular-nums;background:var(--panel2)}
  .fx .up{background:var(--teal-l);color:var(--teal)}
  .fx .dn{background:var(--rust-l);color:var(--rust)}
  .fx .neu{background:var(--panel2);color:var(--dim)}
  .fx .rsk{background:var(--ochre-l);color:#8a6410}

  /* ---------- 결과 ---------- */
  .verdict{padding:22px 20px 8px;text-align:center}
  .vlabel{font-size:12.5px;color:var(--dim);letter-spacing:.14em;font-weight:800}
  .vchoice{font-size:28px;font-weight:800;letter-spacing:-.035em;margin:6px 0 16px;
    color:var(--blue);line-height:1.25}
  .vwho{display:inline-flex;align-items:center;gap:10px;margin:0 0 12px}
  .vwho img{width:46px;height:46px;object-fit:cover;border:2px solid var(--ink);display:block}
  .vwho .em{width:46px;height:46px;display:grid;place-items:center;font-size:24px;
    border:2px solid var(--ink);background:var(--panel2)}
  .vwho span{font-size:13.5px;font-weight:800;color:var(--dim)}
  .vmsg{font-size:17px;line-height:1.62;margin:0 auto 4px;max-width:46ch;font-weight:500;
    background:var(--panel2);border:2px solid var(--ink);padding:12px 16px;text-align:left;
    box-shadow:4px 4px 0 var(--shade)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .chip{display:inline-block;padding:4px 13px;font-size:15px;font-weight:800;
    border:2px solid var(--ink);font-variant-numeric:tabular-nums}
  .chip.up{background:var(--teal-l);color:var(--teal)}
  .chip.down{background:var(--rust-l);color:var(--rust)}
  .chip.neu{background:var(--panel2);color:var(--dim)}

  .vfoot{padding:4px 18px 18px;text-align:right}
</style>
<style>
  /* 좁은 화면에서는 표를 조인다. 라벨이 세로로 깨지면 읽기가 어렵다. */
  @media(max-width:560px){
    body{font-size:16px}
    .wrap{padding:16px 14px 70px}
    h1{font-size:25px}
    table{font-size:13.5px}
    th,td{padding:6px 5px}
    td:first-child{white-space:nowrap}
    .stat{min-width:104px;padding:8px 11px}
    .stat .v{font-size:19px}
    .card{padding:15px 14px 13px}
    .primary{padding:14px 22px;font-size:17px}
    .optlist button b{font-size:16.5px}
    .vchoice{font-size:24px}
    .big{font-size:40px}
  }
</style>
<style>
  .modecard.on{background:var(--blue-l);border-color:var(--blue);box-shadow:5px 5px 0 var(--blue)}
  .modecard.on b{color:var(--blue)}
</style>
<style>
  /* ============================================================
     글씨
       본문 — Pretendard. 맑은 고딕보다 자간과 획이 정돈돼 있다.
       제목·숫자·배지 — Galmuri11. 픽셀 아트와 같은 격자 위에 놓인다.
     둘 다 CDN이라, 인터넷이 없으면 시스템 고딕으로 내려가고 게임은 그대로 돈다.
     ============================================================ */
  :root{
    --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --px:"Galmuri11","Galmuri11 Condensed",var(--sans);
  }
  body{font-family:var(--sans)}

  /* 픽셀 폰트는 작게 쓰면 뭉개진다. 11의 배수(11·22·33)에서 제일 또렷하다. */
  h1{font-family:var(--px);font-size:28px;letter-spacing:0;font-weight:400;line-height:1.35}
  h2{font-family:var(--px);font-size:18px;letter-spacing:0;font-weight:400}
  .big{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:44px}
  .stat .v{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:18px}
  .stat .k{letter-spacing:0}
  .phase{font-family:var(--px);font-weight:400;font-size:13px}
  .ltop b,.cell b{font-family:var(--px);font-weight:400;letter-spacing:0}
  .ltop i,.cell i,.chip,.pltag,.fx span{font-family:var(--px);font-weight:400;letter-spacing:0}
  .vchoice{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:26px}
  .modecard b{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:22px}
  .modecard .n{font-family:var(--px);font-weight:400;letter-spacing:0}
  .primary{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:18px}
  .deckhead{font-family:var(--px);font-weight:400;letter-spacing:0}
  .crew-plate b{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:15px}
  .optlist button b{font-family:var(--px);font-weight:400;letter-spacing:0;font-size:17px}
  .halltag,.hallfoot,.lbot .sub,.pstat b{font-family:var(--px);font-weight:400;letter-spacing:0}
  /* 표는 한 글꼴로만 쓴다.
     합계 줄과 증감 칸만 픽셀 폰트로 바꿔놨더니 같은 표 안에서 글씨가 두 종류로 보여
     숫자를 눈으로 따라가기가 어려웠다. 강조는 글꼴이 아니라 굵기와 색으로 한다.
     숫자는 tabular-nums로 자릿수를 맞춰 세로로 읽히게 한다. */
  table{font-family:var(--sans);font-variant-numeric:tabular-nums}
  td,th{letter-spacing:0}
  tr.tot td{font-weight:800}

  /* 픽셀 폰트는 글자 위아래 여백이 넉넉해서 줄간격을 조금 줄여야 맞는다 */
  h1,h2,.vchoice,.modecard b,.big{line-height:1.4}
  @media(max-width:560px){
    h1{font-size:22px} .big{font-size:33px} .vchoice{font-size:22px}
    .modecard b{font-size:18px} .primary{font-size:16px}
  }
</style>
<style>
  /* ============================================================
     경영 대시보드 · 청구서 · 경고 · 부서 보고
     ============================================================ */
  .yearban{background:var(--blue);color:#fff;border-color:var(--ink);display:flex;flex-direction:column;gap:4px}
  .yearban b{font-family:var(--px);font-weight:400;font-size:20px}
  .yearban span{font-size:15px;opacity:.95}
  .yearban .chap{font-size:13px;opacity:.75}
  .yearban .note{color:var(--ink)}

  .dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
  .dtile{border:2px solid var(--ink);background:var(--panel2);padding:7px 10px;display:flex;flex-direction:column;gap:1px}
  .dtile i{font-style:normal;font-size:12px;color:var(--dim);font-weight:700}
  .dtile b{font-family:var(--px);font-weight:400;font-size:18px;line-height:1.3}
  .dtile span{font-family:var(--px);font-size:12px}
  .dtile .up{color:var(--teal)} .dtile .dn{color:var(--rust)} .dtile .neu{color:var(--dim)}

  .fired{border-color:var(--rust);background:var(--rust-l)}
  .fired h2{color:var(--rust)}
  .fire{border-left:5px solid var(--rust);background:var(--panel);padding:9px 13px;margin:8px 0;
    display:flex;flex-direction:column;gap:3px}
  .fire b{font-size:16px}
  .fire span{font-size:13.5px;color:var(--dim);font-weight:600}

  .imps{display:flex;flex-direction:column;gap:10px}
  .imp b{font-size:15px}
  .warns .warn{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
  .warns .warn i{font-style:normal;font-family:var(--px);font-size:13px;color:var(--rust);white-space:nowrap}
  .warns .warn span{font-size:14.5px}

  .briefs{display:flex;flex-direction:column;gap:10px}
  .brief{display:flex;gap:12px;align-items:flex-start}
  .bface{width:52px;height:52px;flex:0 0 52px;border:2px solid var(--ink);overflow:hidden;background:var(--panel2)}
  .bface img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  .btext{font-size:15.5px;line-height:1.55}
  .bwho{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);font-weight:800;margin-bottom:1px}
  .bwho em{font-style:normal;font-family:var(--px);font-size:11px;padding:0 7px;border:1.5px solid var(--ink)}
  .k-ok{background:var(--teal-l);color:var(--teal)}
  .k-est{background:var(--ochre-l);color:#8a6410}
  .k-rum{background:var(--rust-l);color:var(--rust)}

  .custbar{grid-template-columns:150px 1fr 72px 84px 92px 158px}
  .custbar .rel{font-size:12px;padding:1px 6px;border:1.5px solid var(--ink);text-align:center;
    white-space:nowrap;font-weight:800}
  .custbar .eff{font-size:12px;font-weight:800;white-space:nowrap;text-align:center;
    padding:1px 6px;border:1.5px solid var(--ink);background:var(--blue-l);color:var(--blue)}
  .custbar.off .eff{background:var(--panel2);color:var(--dim);border-style:dashed}
  .custbar.off .fill{opacity:.45}
  .custbar .leak{font-size:12.5px;color:var(--dim);white-space:nowrap;font-weight:700;
    font-variant-numeric:tabular-nums}
  .rel.up{background:var(--teal-l);color:var(--teal)} .rel.neu{background:var(--panel2);color:var(--dim)}
  .rel.dn{background:var(--rust-l);color:var(--rust)}
  @media(max-width:760px){ .custbar{grid-template-columns:120px 1fr 62px 72px 84px;font-size:13px}
    .custbar .leak{grid-column:1 / -1;text-align:right;margin-top:-4px} }

  /* 영업 자원 배분 표 — 0점을 준 줄은 눈에 보이게 죽인다 */
  .ordt tr.off td{opacity:.5;background:var(--panel2)}
  .ordt tr.off td.oname::after{content:' · 무관리';font-size:10.5px;color:var(--rust);font-weight:800}

  .profile{max-width:620px;margin:16px auto 0;text-align:left}
  .profile p{font-size:16.5px;line-height:1.75;margin:0 0 10px}
</style>
<style>
  /* 경영지표 표는 좁은 화면에서 표만 옆으로 민다. 페이지 전체가 밀리면 안 된다. */

<style>

  .topbar b{font-family:var(--px);font-weight:400;font-size:18px}
  .topbar span{font-family:var(--px);font-size:16px}
